<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="노트">
<meta name="theme-color" content="#0f1218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>학습 노트</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0f1218; --panel:#171b23; --panel2:#1e232d; --line:#2a303c; --text:#e6e9ef; --muted:#8a93a5;
    --up:#26a69a; --down:#ef5350; --ma20:#f5c542; --ma60:#4aa3ff; --ma120:#c77dff; --accent:#4aa3ff;
    --good:#2ecc71; --mid:#f5c542; --bad:#ef5350;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  #status{color:var(--muted);font-size:12px}
  /* 화면 전체 높이를 헤더 + 본문으로 나눔 (아이패드 Safari의 100vh 오차·상단바 높이 변화에도 잘리지 않게) */
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  header{flex:none}
  /* 행 높이를 화면에 고정(minmax(0,1fr)) → 오른쪽 매매 기록이 길어져도 차트 영역이 늘어나지 않음 */
  .layout{display:grid;grid-template-columns:1fr 380px;grid-template-rows:minmax(0,1fr);gap:0;flex:1;min-height:0;overflow:hidden}
  main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  label.small{color:var(--muted);font-size:12px}
  input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.buy{background:var(--up);border-color:var(--up);color:#fff;font-weight:700;font-size:15px;padding:10px}
  button.sell{background:var(--down);border-color:var(--down);color:#fff;font-weight:700;font-size:15px;padding:10px}
  button.on{background:var(--accent);color:#fff}
  button:disabled,input:disabled{opacity:.4;cursor:not-allowed}
  button.close{background:#3a4150;border-color:#3a4150;color:#fff;font-weight:700;font-size:15px;padding:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:4px 12px;font-size:12px}
  .tag.long{background:rgba(38,166,154,.2);color:var(--up)} .tag.short{background:rgba(239,83,80,.2);color:var(--down)}
  .tag.close{background:rgba(74,163,255,.2);color:var(--accent)} .tag.liq{background:rgba(245,197,66,.25);color:var(--mid)}
  #legend{padding:6px 12px;font-size:12px;color:var(--muted);min-height:26px;font-variant-numeric:tabular-nums}
  #legend b{color:var(--text);font-weight:600}
  .charts{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
  /* contain:strict — 차트가 그린 캔버스 크기가 다시 칸 크기를 키우는 순환을 막음 (Safari에서 차트가 점점 커지던 원인) */
  #mainChart,#rsiChart,#macdChart{contain:strict;overflow:hidden;position:relative}
  #mainChart{flex:3;min-height:0}
  .rsi-title{font-size:11px;color:var(--muted);padding:2px 12px;border-top:1px solid var(--line)}
  #rsiChart,#macdChart{flex:1;min-height:110px}
  aside{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}
  aside > .card{flex:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  .kv{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-variant-numeric:tabular-nums}
  .kv span:nth-child(odd){color:var(--muted)}
  .big{font-size:22px;font-weight:700}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .ratio{display:flex;gap:6px;margin-bottom:8px}
  .ratio button{flex:1}
  .tradebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .orow{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:8px;flex-wrap:wrap;color:var(--muted)}
  .orow input{width:70px;padding:3px 6px}
  .orow input.wide{width:120px}
  .orow button{padding:3px 8px;font-size:12px}
  #pending .po{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:5px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
  #pending .po button{padding:2px 8px;font-size:12px}
  #pending:not(:empty){margin-top:8px}
  .hint{font-size:11px;color:var(--muted);margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chips button,button.chip{padding:2px 9px;border-radius:12px;font-size:12px}
  .ttags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .ttag{font-size:11px;padding:1px 7px;border-radius:10px;background:rgba(74,163,255,.15);color:#9cc8ff}
  .memo{font-size:12px;margin-top:4px;color:#d6dae3}
  #riskInfo{color:var(--text)}
  button.drawing{background:var(--mid);border-color:var(--mid);color:#000}
  #mainChart{z-index:1}
  #htfBox{position:absolute;top:6px;left:8px;width:250px;height:150px;z-index:10;pointer-events:none;display:none;
    background:rgba(15,18,24,.9);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  #htfBox .cap{position:absolute;top:3px;left:8px;font-size:11px;color:var(--muted);z-index:4}
  #htfChart{position:absolute;inset:0}
  .rv tr.click{cursor:pointer} .rv tr.click:hover td{background:var(--panel2)}
  .trade .top .jump{cursor:pointer;text-decoration:underline dotted}
  @media (max-width:600px){ #htfBox{width:180px;height:110px} }
  .sig{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
  .sig:last-child{border-bottom:0}
  .trade{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .trade .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .tag{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:700}
  .tag.buy{background:rgba(38,166,154,.2);color:var(--up)} .tag.sell{background:rgba(239,83,80,.2);color:var(--down)}
  .auto{font-size:11px;color:var(--mid);margin-left:4px}
  .grade{font-size:12px;font-weight:700}
  .g-good{color:var(--good)} .g-mid{color:var(--mid)} .g-bad{color:var(--bad)}
  .trade ul{margin:4px 0 0;padding-left:16px;font-size:12px;line-height:1.55}
  .trade li.p{color:#9be7b5} .trade li.n{color:#f5a3a1} .trade li.z{color:var(--muted)}
  .hind{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;line-height:1.5}
  .muted{color:var(--muted)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(680px,94vw);max-height:86vh;overflow:auto}
  #modal h2{margin-top:0}
  #modal ul{line-height:1.7}
  .reveal{margin-top:12px;padding:10px 12px;border:1px solid var(--mid);border-radius:8px;background:rgba(245,197,66,.08);line-height:1.6}
  .htable{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .htable th,.htable td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
  .htable th:first-child,.htable td:first-child,.htable th:nth-child(2),.htable td:nth-child(2){text-align:left}
  .htable th{color:var(--muted);font-weight:600}
  .chartbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
  .chartbox .cap{font-size:12px;color:var(--muted);margin-bottom:4px}
  .mbtns2{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:20;max-width:92vw;text-align:center}
  /* ── 터치 기기(아이패드 등) ── */
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  header{padding-top:max(10px, env(safe-area-inset-top))}
  @media (pointer:coarse){
    button{min-height:40px}
    input,select{font-size:16px;min-height:40px}   /* iOS 입력창 자동 확대 방지 */
    .seg button{min-height:34px}
    .orow button,#pending .po button{min-height:36px}
    .chips button{min-height:34px}
  }
  #mbar{display:none}
  @media (max-width:900px){
    /* 세로 화면: 페이지 스크롤 방식, 차트 높이를 고정해서 RSI가 항상 다 보이게 */
    body{display:block;height:auto;padding-bottom:calc(118px + env(safe-area-inset-bottom))}
    .layout{grid-template-columns:1fr;grid-template-rows:auto;flex:none;overflow:visible}
    main{overflow:visible}
    main{border-right:0}
    .charts{flex:none}
    /* svh = 주소창이 펼쳐진 상태 기준의 고정 높이 → 스크롤 중 주소창이 접혀도 차트 크기가 변하지 않음 */
    #mainChart{flex:none;height:48vh;height:48svh;min-height:300px}
    #rsiChart,#macdChart{flex:none;height:160px}
    #mbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(23,27,35,.97);
      border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
    .mstat{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px;font-variant-numeric:tabular-nums}
    .mstat b{font-size:16px}
    .mbtns{display:flex;gap:6px}
    .mbtns button{flex:1;min-height:50px;font-size:15px;padding:6px 4px}
    .mbtns button.buy,.mbtns button.sell,.mbtns button.close{flex:1.4}
    #toast{bottom:calc(130px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<header>
  <h1 id="title">BTC/USDT 4시간봉 매매 연습</h1>
  <span id="status">데이터 불러오는 중…</span>
</header>

<div class="layout">
  <main>
    <div class="toolbar">
      <label class="small">코인</label>
      <select id="coin">
        <option value="BTC" selected>BTC</option>
        <option value="ETH">ETH</option>
        <option value="SOL">SOL</option>
        <option value="XRP">XRP</option>
        <option value="BNB">BNB</option>
        <option value="DOGE">DOGE</option>
      </select>
      <label class="small">봉</label>
      <select id="tf">
        <option value="15m">15분</option>
        <option value="30m">30분</option>
        <option value="1h">1시간</option>
        <option value="4h" selected>4시간</option>
        <option value="1d">1일</option>
      </select>
      <span class="sep"></span>
      <label class="small">시작</label>
      <input type="date" id="startDate">
      <button id="btnRandom">🎲 랜덤</button>
      <button id="btnStart" class="primary">새 연습 시작</button>
      <button id="btnBlind" title="날짜와 가격대를 숨기고 연습">🙈 블라인드</button>
      <span class="sep"></span>
      <button id="btnNext" title="→ 또는 Space">▶ 다음 봉</button>
      <button id="btnNext6">⏩ +6봉</button>
      <button id="btnAuto" title="A">⏯ 자동재생</button>
      <select id="speed">
        <option value="1000">느림</option>
        <option value="400" selected>보통</option>
        <option value="150">빠름</option>
        <option value="50">매우 빠름</option>
      </select>
      <span class="sep"></span>
      <button id="btnBB" title="볼린저밴드(20, 2) 켜기/끄기">BB</button>
      <select id="lower" title="아래 보조지표">
        <option value="rsi">RSI</option>
        <option value="macd">MACD</option>
        <option value="both">RSI + MACD</option>
      </select>
      <span class="sep"></span>
      <button id="btnHTF" title="상위 봉 흐름을 작은 차트로 보기">🔭 상위봉</button>
      <span class="sep"></span>
      <button id="btnHLine" title="차트를 한 번 탭해서 수평선(지지·저항) 긋기">─ 수평</button>
      <button id="btnTLine" title="차트의 두 점을 탭해서 추세선 긋기">╱ 추세</button>
      <button id="btnFib" title="파동의 시작·끝 두 점을 탭해서 피보나치 되돌림 긋기">𝑓 피보</button>
      <button id="btnAlert" title="차트를 탭한 가격에 닿으면 자동재생을 멈추고 알림">🔔 알림</button>
      <button id="btnUndoLine" title="마지막으로 그은 선 지우기">🧹 지우기</button>
      <span class="sep"></span>
      <button id="btnReport">📊 리포트</button>
      <button id="btnReview">🔍 복기</button>
      <button id="btnHistory">📈 내 기록</button>
    </div>
    <div id="legend"></div>
    <div class="charts">

      <div id="mainChart"></div>
      <div id="htfBox"><div class="cap" id="htfCap"></div><div id="htfChart"></div></div>
      <div class="rsi-title" id="lowerTitle"></div>
      <div id="rsiChart"></div>
      <div class="rsi-title" id="macdTitle"></div>
      <div id="macdChart"></div>
    </div>
  </main>

  <aside>
    <div class="card">
      <h3>계좌 현황</h3>
      <div class="big" id="totalRet">0.00%</div>
      <div class="kv" id="acctKv" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h3 style="display:flex;justify-content:space-between;align-items:center">주문
        <span class="seg" id="modeBtns"><button data-m="spot" class="on">현물</button><button data-m="fut">선물</button></span></h3>
      <div class="orow">
        <span class="seg" id="otBtns"><button data-o="market" class="on">시장가</button><button data-o="limit">지정가</button></span>
        수수료 <input id="fee" type="number" step="0.01" value="0.1" style="width:56px">%
      </div>
      <div class="orow" id="limitRow" style="display:none">
        지정가 <input id="limitPx" class="wide" type="number" step="any" inputmode="decimal">
        <button id="limitNow">현재가</button>
      </div>
      <div id="futOpts" style="display:none;margin-bottom:8px;font-size:12px">
        레버리지 <select id="lev">
          <option>1</option><option>2</option><option selected>3</option><option>5</option><option>10</option>
          <option>20</option><option>50</option><option>100</option>
        </select>배 <span class="muted">· 격리 마진 · 유지증거금률 0.5% · 펀딩비 8시간마다 0.01% (롱이 숏에게 지급)</span>
      </div>
      <div class="orow">
        손절 <input id="slPct" type="number" step="0.5" min="0" placeholder="없음" inputmode="decimal">%
        익절 <input id="tpPct" type="number" step="0.5" min="0" placeholder="없음" inputmode="decimal">%
        <button id="btnStops" title="지금 보유 중인 포지션에 손절·익절 적용">보유분에 적용</button>
      </div>
      <div class="orow">
        리스크 <span class="seg" id="riskBtns"><button data-k="0" class="on">끔</button><button data-k="0.5">0.5%</button><button data-k="1">1%</button><button data-k="2">2%</button></span>
        <span id="riskInfo"></span>
      </div>
      <div class="orow" style="align-items:flex-start">
        <span style="padding-top:4px">근거</span>
        <span class="chips" id="tagBtns" style="flex:1"></span>
      </div>
      <div class="orow">
        <input id="memo" type="text" placeholder="진입 메모 (선택) — 예: 4시간 지지선 재확인" style="flex:1;width:auto" maxlength="80">
      </div>
      <div class="ratio" id="ratioBtns">
        <button data-r="0.25">25%</button>
        <button data-r="0.5">50%</button>
        <button data-r="1" class="on">100%</button>
      </div>
      <div class="tradebtns" id="spotBtns">
        <button class="buy" id="btnBuy">매수 (B)</button>
        <button class="sell" id="btnSell">매도 (S)</button>
      </div>
      <div class="tradebtns" id="futBtns" style="display:none;grid-template-columns:1fr 1fr 1fr">
        <button class="buy" id="btnLong">롱 (B)</button>
        <button class="sell" id="btnShort">숏 (S)</button>
        <button class="close" id="btnClose">청산 (X)</button>
      </div>
      <div id="pending"></div>
      <div class="hint" id="orderHint"></div>
    </div>

    <div class="card">
      <h3>현재 봉 지표 상태</h3>
      <div id="signals" class="muted">-</div>
    </div>

    <div class="card">
      <h3>매매 기록 & 타점 평가</h3>
      <div id="trades" class="muted">아직 매매가 없습니다. 차트를 보고 매수/매도해 보세요.</div>
    </div>
  </aside>
</div>

<!-- 좁은 화면(아이패드 세로 등)에서 항상 보이는 하단 매매 바 -->
<div id="mbar">
  <div class="mstat"><span>수익률 <b id="mRet">0.00%</b></span><span id="mInfo" class="muted"></span></div>
  <div class="mbtns">
    <button id="mNext">▶ 다음</button>
    <button id="mJump">⏩</button>
    <button id="mAuto">⏯</button>
    <button id="mRatio" title="주문 비율">100%</button>
    <button class="buy" id="mBuy">매수</button>
    <button class="sell" id="mSell">매도</button>
    <button class="close" id="mClose" style="display:none">청산</button>
  </div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<input type="file" id="impFile" accept="application/json,.json" style="display:none">
<div id="toast"></div>

<script>
(() => {
'use strict';
const KST = 9 * 3600;          // 차트 시간을 한국시간으로 표시
// 봉 주기별 설정: sec=봉 길이, look=사후평가 봉 수, lookTxt=그 기간, jump=빨리감기 봉 수,
// k=변동성 배율(이격도·사후평가 기준을 주기에 맞게 조정), pages=불러올 1000봉 묶음 수

async function fetchBinance(symbol, interval, pages) {
  const hosts = ['https://data-api.binance.vision', 'https://api.binance.com', 'https://api1.binance.com'];
  for (const h of hosts) {
    try {
      const base = `${h}/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=1000`;
      const get = async url => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };
      // 1) 최신 1000봉을 받아 기준 시각을 잡고
      const first = await get(base);
      if (!first.length) throw new Error('empty');
      const step = first.length > 1 ? first[1][0] - first[0][0] : 0;
      // 2) 그 이전 구간들은 동시에 요청 (순서대로 받으면 페이지 수만큼 느려짐)
      const jobs = [];
      for (let p = 1; p < pages && step; p++) {
        const end = first[0][0] - 1 - (p - 1) * 1000 * step;
        jobs.push(get(`${base}&endTime=${end}`).catch(() => []));
      }
      $('status').textContent = `데이터 불러오는 중… (${pages}구간)`;
      const rest = await Promise.all(jobs);
      const map = new Map();
      [first, ...rest].flat().forEach(r => map.set(r[0], r));   // 겹치는 봉 제거
      const now = Date.now();
      const all = [...map.values()].sort((a, b) => a[0] - b[0]);
      return { src: 'Binance', data: all.filter(r => r[6] < now).map(r => ({
        time: Math.floor(r[0] / 1000) + KST, open: +r[1], high: +r[2], low: +r[3], close: +r[4], volume: +r[5] })) };
    } catch (e) { console.warn('fetch fail', h, e); }
  }
  return null;
}
function sampleData(sec) {          // 오프라인용 가상 데이터
  const out = []; let p = 30000, t = Math.floor(Date.UTC(2023, 0, 1) / 1000) + KST;
  const s = Math.sqrt(sec / 14400);
  for (let i = 0; i < 3000; i++) {
    const drift = Math.sin(i / 180) * 0.002 * s, vol = 0.012 * s;
    const o = p, c = o * Math.exp(drift + vol * (Math.random() * 2 - 1) * 1.2);
    const h = Math.max(o, c) * (1 + Math.random() * 0.008), l = Math.min(o, c) * (1 - Math.random() * 0.008);
    out.push({ time: t, open: o, high: h, low: l, close: c, volume: 800 + Math.random() * 1500 * (1 + Math.abs(c - o) / o * 60) });
    p = c; t += sec;
  }
  return out;
}

function sma(src, n) {
  const out = new Array(src.length).fill(null); let s = 0;
  for (let i = 0; i < src.length; i++) { s += src[i]; if (i >= n) s -= src[i - n]; if (i >= n - 1) out[i] = s / n; }
  return out;
}
function ema(src, n) {
  const out = new Array(src.length).fill(null), k = 2 / (n + 1); let e = null;
  for (let i = 0; i < src.length; i++) { const v = src[i]; if (v == null) continue; e = e == null ? v : v * k + e * (1 - k); out[i] = e; }
  return out;
}
function rsiCalc(cl, n = 14) {
  const out = new Array(cl.length).fill(null); let g = 0, l = 0;
  for (let i = 1; i < cl.length; i++) {
    const d = cl[i] - cl[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); } }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); }
  }
  return out;
}
function computeIndicators() {
  const cl = C.map(c => c.close), vo = C.map(c => c.volume), n = cl.length;
  MA20 = sma(cl, 20); MA60 = sma(cl, 60); MA120 = sma(cl, 120); RSI = rsiCalc(cl, 14); VAVG = sma(vo, 20);
  // 볼린저밴드 (20, 2σ)
  BBU = new Array(n).fill(null); BBL = new Array(n).fill(null);
  for (let i = 19; i < n; i++) {
    const m = MA20[i]; let v = 0;
    for (let j = i - 19; j <= i; j++) v += (cl[j] - m) ** 2;
    const sd = Math.sqrt(v / 20); BBU[i] = m + 2 * sd; BBL[i] = m - 2 * sd;
  }
  // MACD (12, 26, 9)
  const e12 = ema(cl, 12), e26 = ema(cl, 26);
  MACD = cl.map((_, i) => i >= 25 ? e12[i] - e26[i] : null);
  MSIG = ema(MACD, 9).map((v, i) => i >= 33 ? v : null);
  MHIST = MACD.map((m, i) => m != null && MSIG[i] != null ? m - MSIG[i] : null);
}

  const pre = auto === 'sl' ? '🛑 손절 주문 ' : auto === 'tp' ? '🎯 익절 주문 ' : auto === 'limit' ? '⏳ 지정가 ' : '';
  toast(`${pre}${ACT[type]} 체결 @ ${fmtPx(price)} — ${t.eval.label}`);
}

// ───────────── 타점 평가 (체결 시점까지의 정보만 사용) ─────────────
function evaluate(t) {
  const i = t.i, c = C[i], r = RSI[i], m20 = MA20[i], m60 = MA60[i], m120 = MA120[i];
  const pts = []; const add = (s, txt) => pts.push({ s, txt });
  // 진입(매수·롱·숏)인지 청산(매도·롱청산·숏청산)인지, 그리고 방향(롱=+1, 숏=-1)
  const isEntry = isEntryType(t.type);
  const dir = (t.type === 'short' || t.type === 'closeShort') ? -1 : 1;
  const L = dir > 0, act = ACT[t.type], R = r.toFixed(1);
  const up = m20 > m60 && c.close > m60, down = m20 < m60 && c.close < m60;
  const d20 = (c.close / m20 - 1) * 100;
  const vr = c.volume / VAVG[i], bull = c.close >= c.open;
  const far = 6 * TF.k, near = 2 * TF.k, lossCut = 5 * TF.k;   // 봉 주기에 맞춘 기준(%)
  // 숏 방향은 지표를 뒤집어서 같은 규칙으로 판단 (숏에게 과매수 = 롱에게 과매도)
  const rr = L ? r : 100 - r, upT = L ? up : down, downT = L ? down : up, dd = d20 * dir, bullT = L ? bull : !bull;

  if (isEntry) {
    // 1) RSI
    if (rr < 30) add(2, L ? `RSI ${R} — 과매도 구간 ${act}. 반등 확률이 높은 자리입니다.` : `RSI ${R} — 과매수 구간 숏 진입. 하락 반전 확률이 높은 자리입니다.`);
    else if (rr < 40) add(1, L ? `RSI ${R} — 낮은 편이라 가격 부담이 적은 ${act}입니다.` : `RSI ${R} — 높은 편이라 하락 여지가 있는 숏 진입입니다.`);
    else if (rr > 70) add(-2, L ? `RSI ${R} — 과매수 구간 ${act}. 단기 고점 추격 위험이 큽니다.` : `RSI ${R} — 과매도 구간 숏 진입. 바닥에서 추격 숏 — 반등(숏 스퀴즈) 위험이 큽니다.`);
    else if (rr > 60) add(-1, L ? `RSI ${R} — 다소 과열된 상태에서의 ${act}입니다.` : `RSI ${R} — 이미 많이 눌린 상태에서의 숏 진입입니다.`);
    else add(0, `RSI ${R} — 중립 구간입니다.`);
    // 2) 추세
    if (upT) add(1, L ? `MA20 > MA60 정배열 & 가격이 MA60 위 — 상승 추세에 순응하는 ${act}입니다.` : `MA20 < MA60 역배열 & 가격이 MA60 아래 — 하락 추세에 순응하는 숏입니다.`);
    else if (downT) add(-1, L ? `역배열 & 가격이 MA60 아래 — 하락 추세 중 ${act}(떨어지는 칼날) 주의.` : `정배열 & 가격이 MA60 위 — 상승 추세를 거스르는 숏, 위험합니다.`);
    else add(0, `이동평균선이 엇갈린 혼조 구간 — 추세 방향이 불분명합니다.`);
    if (m120 != null) add(0, (c.close > m120) === L ? `MA120 기준 장기 추세도 ${L ? '상승' : '하락'} 쪽 — 방향이 우호적입니다.` : `MA120 기준 장기 추세는 반대 방향입니다.`);
    // 3) 이격도
    if (dd > far) add(-1, L ? `MA20 대비 ${fmtP(d20)} 이격 — 단기 급등 후 추격 ${act}입니다.` : `MA20 대비 ${fmtP(d20)} — 급락 후 추격 숏입니다.`);
    else if (upT && Math.abs(d20) <= near) add(1, L ? `상승 추세 중 MA20 부근(${fmtP(d20)}) — 교과서적인 눌림목 ${act}입니다.` : `하락 추세 중 MA20 저항 부근(${fmtP(d20)}) — 교과서적인 되돌림 숏입니다.`);
    else if (dd < -far) add(1, L ? `MA20 대비 ${fmtP(d20)} 과도 하락 — 기술적 반등을 노릴 수 있는 구간입니다.` : `MA20 대비 ${fmtP(d20)} 과도 상승 — 되돌림 하락을 노릴 수 있는 구간입니다.`);
    // 4) 거래량
    if (vr > 1.5 && bullT) add(1, L ? `평균 대비 ${vr.toFixed(1)}배 거래량 양봉 — 매수세 유입이 확인됩니다.` : `평균 대비 ${vr.toFixed(1)}배 거래량 음봉 — 매도세가 확인됩니다.`);
    else if (vr > 1.5 && rr < 35) add(0, L ? `거래량 ${vr.toFixed(1)}배 투매성 음봉 — 바닥 신호일 수 있으나 확인이 필요합니다.` : `거래량 ${vr.toFixed(1)}배 급등 양봉 — 고점 신호일 수 있으나 확인이 필요합니다.`);
    else if (vr > 1.5) add(-1, L ? `거래량 ${vr.toFixed(1)}배 실린 음봉 — 매도 압력이 강한 상태입니다.` : `거래량 ${vr.toFixed(1)}배 실린 양봉 — 매수 압력이 강해 숏에 불리합니다.`);
    else if (vr < 0.6) add(0, `거래량이 평균의 ${vr.toFixed(1)}배로 적음 — 신호 신뢰도가 낮습니다.`);
    // 5) 레버리지 (선물)
    if (t.lev) {
      const dist = (1 / t.lev - MMR) * 100;
      if (t.lev >= 20) add(-1, `레버리지 ${t.lev}배 — 가격이 약 ${dist.toFixed(1)}%만 반대로 가도 청산됩니다. 매우 위험합니다.`);
      else if (dist < 3 * far) add(0, `레버리지 ${t.lev}배 — 청산가까지 약 ${dist.toFixed(1)}%. 손절가를 꼭 정해 두세요.`);
      else add(0, `레버리지 ${t.lev}배 — 청산가까지 약 ${dist.toFixed(1)}%로 여유가 있습니다.`);
    }
    // 6) 손절·익절 계획
    const st = t.stop;
    if (st && st.sl) {
      add(1, `손절가 ${fmtPx(st.sl)}(-${st.slPct}%)를 미리 정했습니다 — 리스크를 먼저 정한 좋은 습관입니다.`);
      if (st.tp) {
        const rrr = st.tpPct / st.slPct;
        if (rrr >= 2) add(1, `손익비 1 : ${rrr.toFixed(1)} — 틀려도 작게 잃고 맞으면 크게 버는 구조입니다.`);
        else if (rrr < 1) add(-1, `손익비 1 : ${rrr.toFixed(1)} — 목표 수익이 손절폭보다 작습니다. 승률이 아주 높아야만 이익이 납니다.`);
        else add(0, `손익비 1 : ${rrr.toFixed(1)} — 2 이상을 목표로 해 보세요.`);
      }
    } else if (st && st.tp) add(0, `익절가 ${fmtPx(st.tp)}만 정하고 손절가는 없습니다. 손절가도 함께 정해 두세요.`);
    else add(0, `손절가를 정하지 않았습니다. 진입과 동시에 손절가를 정하는 습관을 들여 보세요.`);
    if (t.risk) add(0, `리스크 ${t.risk.pct}% 기준 수량 — 손절(-${t.risk.sl}%)되면 자산의 약 ${t.risk.pct}%만 잃도록 크기를 정했습니다.`);
    if (t.tags && t.tags.includes('감') && t.tags.length === 1) add(0, `근거를 '감'으로만 기록했습니다. 감이 맞는지는 '내 기록'의 근거별 성적에서 확인해 보세요.`);
    else if (!t.tags || !t.tags.length) add(0, `진입 근거 태그를 고르지 않았습니다. 근거를 남기면 어떤 자리에서 잘 맞는지 기록에서 볼 수 있습니다.`);
    if (t.auto === 'limit') add(0, `지정가 주문 체결 — 원하는 가격을 기다린 진입입니다.`);
  } else {
    // 청산(매도·롱청산·숏청산): 포지션 방향 기준으로 '나가기 좋은 자리'인지 평가
    if (t.auto === 'sl') add(1, `미리 정한 손절가에서 자동 정리 — 계획대로 손실을 끊었습니다.`);
    else if (t.auto === 'tp') add(1, `미리 정한 익절가에서 자동 정리 — 계획대로 수익을 확정했습니다.`);
    else if (t.auto === 'limit') add(0, `지정가 주문으로 정리했습니다.`);
    if (rr > 70) add(2, L ? `RSI ${R} — 과매수 구간 ${act}. 좋은 차익실현 자리입니다.` : `RSI ${R} — 과매도 구간 숏 청산. 좋은 익절 자리입니다.`);
    else if (rr > 60) add(1, L ? `RSI ${R} — 높은 편이라 ${act}하기 괜찮은 자리입니다.` : `RSI ${R} — 낮은 편이라 숏을 정리하기 괜찮은 자리입니다.`);
    else if (rr < 30) add(-2, L ? `RSI ${R} — 과매도 구간 ${act}. 바닥 근처 패닉셀일 가능성이 있습니다.` : `RSI ${R} — 과매수 구간 숏 청산. 급등에 쫓겨 고점에서 되산 것일 수 있습니다.`);
    else if (rr < 40) add(-1, L ? `RSI ${R} — 이미 많이 눌린 상태에서의 ${act}입니다.` : `RSI ${R} — 이미 많이 오른 상태에서의 숏 청산입니다.`);
    else add(0, `RSI ${R} — 중립 구간입니다.`);
    if (downT) add(1, L ? `역배열 하락 추세 구간에서 ${act} — 리스크 관리 측면에서 적절합니다.` : `정배열 상승 전환 구간에서 숏 청산 — 리스크 관리 측면에서 적절합니다.`);
    else if (upT && dd > 0) add(-1, L ? `정배열 상승 추세가 살아있고 MA20 위 — 너무 일찍 ${act}했을 수 있습니다.` : `하락 추세가 살아있고 MA20 아래 — 숏을 너무 일찍 정리했을 수 있습니다.`);
    else if (upT) add(0, L ? `상승 추세 중 MA20 이탈 — 단기 조정에 대응한 ${act}입니다.` : `하락 추세 중 MA20 위로 반등 — 단기 반등에 대응한 숏 청산입니다.`);
    else add(0, `이동평균선 혼조 구간에서의 ${act}입니다.`);
    if (dd > far) add(1, L ? `MA20 대비 ${fmtP(d20)} 이격 — 과열 구간에서의 차익실현입니다.` : `MA20 대비 ${fmtP(d20)} 이격 — 과도 하락 구간에서의 숏 익절입니다.`);
    else if (dd < -far) add(-1, L ? `MA20 대비 ${fmtP(d20)} 과도 하락 후 ${act} — 반등 직전에 던졌을 수 있습니다.` : `MA20 대비 ${fmtP(d20)} 급등 후 숏 청산 — 되돌림 직전에 손절했을 수 있습니다.`);
    if (vr > 1.5 && !bullT) add(1, L ? `거래량 ${vr.toFixed(1)}배 실린 음봉 — 매도 압력을 확인하고 대응했습니다.` : `거래량 ${vr.toFixed(1)}배 실린 양봉 — 매수 압력을 확인하고 대응했습니다.`);
    else if (vr > 1.5 && rr > 70) add(1, `거래량 ${vr.toFixed(1)}배 과열 — 클라이맥스(${L ? '고점' : '저점'}) 가능성이 있는 자리입니다.`);
    else if (vr > 1.5) add(-1, L ? `거래량 ${vr.toFixed(1)}배 강한 매수세 유입 중 ${act} — 상승 초입일 수 있습니다.` : `거래량 ${vr.toFixed(1)}배 강한 매도세 중 숏 청산 — 하락 초입일 수 있습니다.`);
    // 손익 관리 (선물은 레버리지 영향을 빼고 '가격 변동률'로 손절 크기를 판단)
    if (t.result) {
      const p = t.result.pct, mv = t.result.move ?? p, roe = t.lev ? ` (ROE, 가격 ${fmtP(mv)})` : '';
      if (p >= 0) add(0, `이번 ${act} 손익 ${fmtP(p)}${roe} 확정.`);
      else if (mv > -lossCut) add(0, `${fmtP(p)}${roe} 손절 — 손실을 작게 끊는 것은 좋은 습관입니다.`);
      else add(-1, `${fmtP(p)}${roe} 손절 — 손실이 커진 뒤의 늦은 손절입니다. 손절 기준을 미리 정하세요.`);
    }
  }
  const score = pts.reduce((a, b) => a + b.s, 0);
  const label = score >= 2 ? '좋은 타점' : score >= 0 ? '보통 타점' : '위험한 타점';
  const g = score >= 2 ? 'g-good' : score >= 0 ? 'g-mid' : 'g-bad';
  return { pts, score, label, g };
}

// ───────────── 사후 평가 (이후 12봉 결과) ─────────────
function hindsight(t) {
  const done = cur - t.i;
  if (t.type === 'liq') return { pending: true, html: '' };
  if (done < LOOKAHEAD) return { pending: true, html: `<span class="muted">⏳ 사후 평가 대기중… (${done}/${LOOKAHEAD}봉, ${TF.lookTxt} 뒤 결과 확인)</span>` };
  const k = TF.k;
  const p = t.price;
  let hi = -Infinity, lo = Infinity;
  for (let k = t.i + 1; k <= t.i + LOOKAHEAD; k++) { hi = Math.max(hi, C[k].high); lo = Math.min(lo, C[k].low); }
  const upP = (hi / p - 1) * 100, dnP = (lo / p - 1) * 100;
  let wHi = -Infinity, wLo = Infinity;
  for (let k = Math.max(0, t.i - LOOKAHEAD); k <= t.i + LOOKAHEAD; k++) { wHi = Math.max(wHi, C[k].high); wLo = Math.min(wLo, C[k].low); }
  const pos = (p - wLo) / (wHi - wLo || 1) * 100;
  let verdict, s;
  const act = ACT[t.type];
  // 매수·롱 진입·숏 청산은 '이후 오르면 좋은' 타점, 매도·숏 진입·롱 청산은 '이후 내리면 좋은' 타점
  if (['buy', 'long', 'closeShort'].includes(t.type)) {
    if (upP >= 3 * k && dnP > -2 * k) { verdict = `${act} 후 거의 흔들림 없이 상승 — 결과적으로 훌륭한 타점입니다.`; s = 1; }
    else if (dnP <= -4 * k && upP < 2 * k) { verdict = t.type === 'closeShort' ? `숏 청산 후 더 내렸습니다 — 너무 일찍 정리했습니다.` : `${act} 후 바로 하락 — 결과적으로 성급했습니다.`; s = -1; }
    else if (pos <= 30) { verdict = `전후 구간의 저점권에서 ${act}했습니다. 좋은 위치입니다.`; s = 1; }
    else if (pos >= 70) { verdict = `전후 구간의 고점권에서 ${act}했습니다.`; s = -1; }
    else { verdict = '등락이 섞인 평범한 결과입니다.'; s = 0; }
  } else {
    if (dnP <= -3 * k && upP < 2 * k) { verdict = t.type === 'short' ? '숏 진입 후 하락 — 결과적으로 훌륭한 숏 타점입니다.' : `${act} 후 추가 하락 — 하락을 잘 피했습니다.`; s = 1; }
    else if (upP >= 4 * k) { verdict = t.type === 'short' ? '숏 진입 후 상승 — 결과적으로 성급한 숏입니다.' : `${act} 후 더 올랐습니다 — 너무 일찍 판 것입니다.`; s = -1; }
    else if (pos >= 70) { verdict = `전후 구간의 고점권에서 ${act}했습니다. 좋은 위치입니다.`; s = 1; }
    else if (pos <= 30) { verdict = `전후 구간의 저점권에서 ${act}했습니다.`; s = -1; }
    else { verdict = '등락이 섞인 평범한 결과입니다.'; s = 0; }
  }
  const g = s > 0 ? 'g-good' : s < 0 ? 'g-bad' : 'g-mid';
  return { pending: false, s, html:
    `<b class="${g}">🔍 사후 평가: ${verdict}</b><br>
     <span class="muted">이후 ${TF.lookTxt}간 최고 <span class="pos">${fmtP(upP)}</span> / 최저 <span class="neg">${fmtP(dnP)}</span> ·
     전후 ${LOOKAHEAD}봉씩 가격범위 중 <b>${pos.toFixed(0)}%</b> 위치 (0%=최저, 100%=최고)</span>` };
}

// ───────────── UI ─────────────
function updateUI() {
  const price = C[cur].close;
  const eq = equity(), ret = (eq / INITIAL - 1) * 100;
  const bh = (price / C[startIdx].close - 1) * 100;
  const row = (k, v) => `<span>${k}</span><span>${v}</span>`, pc = v => `<span class="${cls(v)}">${fmtP(v)}</span>`;
  $('totalRet').innerHTML = pc(ret);
  let h = row(blind ? '현재 시점' : '현재 시각(KST)', fmtT(C[cur].time)) + row('현재가', fmtPx(price)) + row('총 평가금액', fmtN(eq) + ' USDT');
  if (mode === 'spot') {
    const avg = acct.btc > 0 ? acct.cost / acct.btc : null;
    h += row('현금', fmtN(acct.cash) + ' USDT') + row(`보유 ${coin}`, fmtQ(acct.btc)) + row('평균 매수가', avg ? fmtPx(avg) : '-')
       + row('보유분 수익률', avg ? pc((price * (1 - feeRate()) / avg - 1) * 100) : '-');
  } else {
    const p = acct.pos;
    h += row('가용 증거금', fmtN(acct.cash) + ' USDT');
    if (p) {
      const upnl = p.side * (price - p.entry) * p.qty, lp = liqPrice(p), dist = (p.side > 0 ? price / lp - 1 : lp / price - 1) * 100;
      h += row('포지션', `<b class="${p.side > 0 ? 'pos' : 'neg'}">${p.side > 0 ? '롱' : '숏'} ${p.lev}배</b> · ${fmtQ(p.qty)} ${coin}`)
         + row('진입가', fmtPx(p.entry))

function gameStats() {
  const price = C[cur].close, eq = equity(), ret = (eq / INITIAL - 1) * 100;
  const bh = (price / C[startIdx].close - 1) * 100;
  const sells = trades.filter(t => t.result), buys = trades.filter(t => isEntryType(t.type));
  const wins = sells.filter(t => t.result.pnl > 0), losses = sells.filter(t => t.result.pnl <= 0);
  const avgW = wins.length ? wins.reduce((a, t) => a + t.result.pct, 0) / wins.length : 0;
  const avgL = losses.length ? losses.reduce((a, t) => a + t.result.pct, 0) / losses.length : 0;
  const good = trades.filter(t => t.eval.score >= 2).length, bad = trades.filter(t => t.eval.score < 0).length;
  const hs = trades.map(hindsight).filter(h => !h.pending);
  const avgScore = trades.length ? trades.reduce((a, t) => a + t.eval.score, 0) / trades.length : 0;
  const liqs = trades.filter(t => t.type === 'liq').length;
  const withSL = buys.filter(t => t.stop && t.stop.sl).length;
  return { eq, ret, bh, sells, buys, wins, losses, avgW, avgL, good, bad, hs, hGood: hs.filter(h => h.s > 0).length, avgScore, liqs, withSL,
    win: sells.length ? wins.length / sells.length * 100 : null };
}

async function retryGame(g) {

// ───────────── 복기 ─────────────
// 포지션을 들고 있는 동안 가장 유리했던 가격(최대 수익)과 가장 불리했던 가격(최대 손실) — 가격 변동률 기준
function excursion(t) {
  if (isEntryType(t.type) || !t.result || t.result.entry == null || t.openT == null) return null;
  const o = tIndex.get(t.openT); if (o == null || o >= t.i) return null;
  const dir = t.type === 'closeShort' || (t.type === 'liq' && t.side < 0) ? -1 : 1, e = t.result.entry;
  let best = -Infinity, worst = Infinity, bi = o, wi = o;
  for (let k = o + 1; k <= t.i; k++) {
    const f = dir * ((dir > 0 ? C[k].high : C[k].low) / e - 1) * 100, a = dir * ((dir > 0 ? C[k].low : C[k].high) / e - 1) * 100;
    if (f > best) { best = f; bi = k; }
    if (a < worst) { worst = a; wi = k; }
  }
  return { mfe: best, mae: worst, bi, wi, dir, o, real: dir * (t.price / e - 1) * 100 };
}
function showReview() {
  stopAuto();
  if (!trades.length) {
    $('modalBox').innerHTML = `<h2>🔍 복기</h2><p class="muted">아직 매매가 없습니다.</p><div class="mbtns2"><span></span><button class="primary" id="closeModal">닫기</button></div>`;
    $('modal').style.display = 'flex'; $('closeModal').onclick = closeModal; return;
  }
  const exs = [];
  const rows = trades.map((t, idx) => {
    const tagCls = { buy: 'buy', long: 'long', sell: 'sell', short: 'short', closeLong: 'close', closeShort: 'close', liq: 'liq' }[t.type];
    let detail = '';
    if (isEntryType(t.type)) {
      const h = hindsight(t);
      detail = h.pending ? '<span class="muted">사후 평가 대기</span>' : `<span class="${h.s > 0 ? 'g-good' : h.s < 0 ? 'g-bad' : 'g-mid'}">${h.s > 0 ? '👍 좋은 자리' : h.s < 0 ? '👎 아쉬운 자리' : '평범'}</span>`;
    } else {
      const x = excursion(t);
      if (x) {
        exs.push(x);
        const miss = x.mfe - x.real;
        detail = `보유 중 최고 <span class="pos">${fmtP(x.mfe)}</span> · 최저 <span class="neg">${fmtP(x.mae)}</span> → 실제 <b class="${cls(x.real)}">${fmtP(x.real)}</b>${x.mfe >= 2 * TF.k && miss > 2 * TF.k ? ` <span style="color:var(--mid)">(놓친 폭 ${miss.toFixed(1)}%p)</span>` : ''}`;
      } else detail = t.result ? `실제 <b class="${cls(t.result.pct)}">${fmtP(t.result.pct)}</b>` : '';
    }
    return `<tr class="click" data-j="${idx}"><td>${fmtT(C[t.i].time)}</td><td><span class="tag ${tagCls}">${ACT[t.type]}</span></td><td>${fmtPx(t.price)}</td><td class="${t.eval.g}">${t.eval.score >= 0 ? '+' : ''}${t.eval.score}</td><td style="text-align:left;white-space:normal">${detail}</td></tr>`;
  }).join('');
  // 요약: 수익 구간을 얼마나 챙겼는지, 수익 중이던 포지션을 손실로 마감한 횟수
  const tips = [];
  const pos = exs.filter(x => x.mfe > 0);
  if (pos.length) {
    const avgM = pos.reduce((a, x) => a + x.mfe, 0) / pos.length, avgR = pos.reduce((a, x) => a + x.real, 0) / pos.length;
    tips.push(`청산한 포지션은 보유 중 평균 <b class="pos">${fmtP(avgM)}</b>까지 갔고, 실제로는 평균 <b class="${cls(avgR)}">${fmtP(avgR)}</b>에 정리했습니다.${avgM < 2 * TF.k ? ' 진입 뒤 크게 유리하게 움직인 적이 적었습니다 — 진입 자리를 먼저 점검해 보세요.' : avgR / avgM < 0.4 ? ' 수익을 많이 돌려주고 있습니다 — 익절 예약이나 분할 익절을 써 보세요.' : avgR / avgM >= 0.6 ? ' 👍 수익 구간을 잘 챙겼습니다.' : ''}`);
  }
  const flip = exs.filter(x => x.mfe >= 2 * TF.k && x.real < 0).length;
  if (flip) tips.push(`한때 +${(2 * TF.k).toFixed(1)}% 이상 수익이던 포지션을 손실로 마감한 경우가 <b>${flip}번</b> 있습니다. 수익이 나면 손절가를 본전으로 올리는 습관을 들여 보세요.`);
  const deep = exs.filter(x => x.mae <= -4 * TF.k && x.real > 0).length;
  if (deep) tips.push(`-${(4 * TF.k).toFixed(1)}% 넘게 물렸다가 수익으로 마감한 경우가 ${deep}번 있습니다. 결과는 좋았지만 손절가가 없었다면 위험했던 매매입니다.`);
  $('modalBox').innerHTML = `<h2>🔍 복기</h2>
    <p class="muted" style="font-size:12px">줄을 누르면 차트가 그 시점으로 이동하고, 청산이면 보유 중 가장 유리했던 봉에 '최고' 표시가 나타납니다. (가격 변동률 기준 · 다음 봉으로 넘어가면 표시가 사라집니다)</p>
    ${tips.length ? `<ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
    <div style="overflow-x:auto"><table class="htable rv"><thead><tr><th>시점</th><th>매매</th><th>체결가</th><th>점수</th><th style="text-align:left">복기</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="mbtns2"><span></span><button class="primary" id="closeModal">닫기</button></div>`;
  $('modal').style.display = 'flex';
  $('closeModal').onclick = closeModal;
  $('modalBox').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => jumpTo(+tr.dataset.j));
}
// 차트를 해당 매매 시점으로 이동 (현재 봉 이후는 원래 보이지 않음)
function jumpTo(idx) {
  const t = trades[idx]; if (!t) return;

  toast(`🔍 ${fmtT(C[t.i].time)} ${ACT[t.type]} @ ${fmtPx(t.price)}${x ? ` — 보유 중 최고 ${fmtP(x.mfe)}, 실제 ${fmtP(x.real)}` : ''}`);
}

// ───────────── 내 기록 (지난 연습 성적 누적) ─────────────
function barSvg(vals, labels, fmt) {
  const W = 620, H = 150, top = 12, bottom = 12, left = 44, n = vals.length;
  const max = Math.max(1e-9, ...vals.map(v => Math.abs(v)));
  const mid = top + (H - top - bottom) / 2, half = (H - top - bottom) / 2, bw = (W - left - 6) / n;
  let g = `<line x1="${left}" x2="${W}" y1="${mid}" y2="${mid}" stroke="#3a4150"/>`
    + `<text x="${left - 6}" y="${top + 4}" fill="#8a93a5" font-size="11" text-anchor="end">${fmt(max)}</text>`
    + `<text x="${left - 6}" y="${mid + 4}" fill="#8a93a5" font-size="11" text-anchor="end">0</text>`
    + `<text x="${left - 6}" y="${H - bottom + 4}" fill="#8a93a5" font-size="11" text-anchor="end">${fmt(-max)}</text>`;
  vals.forEach((v, i) => {
    const h = Math.max(1, Math.abs(v) / max * half), x = left + i * bw + bw * 0.15, y = v >= 0 ? mid - h : mid;
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${v >= 0 ? '#26a69a' : '#ef5350'}"><title>${labels[i]}: ${fmt(v)}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

  } else {
    const ex = H.map(h => h.ret - h.bh), wins = H.filter(h => h.win != null).map(h => h.win);
    const pc = v => v == null ? '-' : `<span class="${cls(v)}">${fmtP(v)}</span>`;
    let trendTxt = '';
    if (H.length >= 6) {

    }

    const rows = H.slice(-30).reverse().map((h, i) => {
      const d = new Date(h.at);
      return `<tr><td>${H.length - i}</td><td>${d.getMonth() + 1}/${d.getDate()} · ${h.blind ? '🙈 ' : ''}${h.coin} ${TFS[h.tf] ? TFS[h.tf].name : h.tf} ${h.mode === 'fut' ? '선물' : '현물'}</td>
        <td>${pc(h.ret)}</td><td>${pc(h.bh)}</td><td>${pc(h.ret - h.bh)}</td><td>${h.n}</td><td>${h.win == null ? '-' : h.win.toFixed(0) + '%'}</td><td>${h.score >= 0 ? '+' : ''}${h.score.toFixed(1)}</td>
        <td><button data-r="${H.length - 1 - i}" title="같은 구간 다시 도전" style="padding:2px 8px">🔁</button></td></tr>`;
    }).join('');
    body = `<div class="kv">
        <span>연습 횟수</span><span>${H.length}판</span>
        <span>평균 수익률</span><span>${pc(avg(H.map(h => h.ret)))}</span>
        <span>단순 보유 대비 평균 초과 수익</span><span>${pc(avg(ex))}</span>
        <span>단순 보유를 이긴 판</span><span>${ex.filter(v => v > 0).length} / ${H.length} (${(ex.filter(v => v > 0).length / H.length * 100).toFixed(0)}%)</span>
        <span>평균 승률</span><span>${wins.length ? avg(wins).toFixed(0) + '%' : '-'}</span>
        <span>평균 타점 점수</span><span>${avg(H.map(h => h.score)).toFixed(2)}</span>
        ${trendTxt}
      </div>
      <div class="chartbox"><div class="cap">판별 <b>단순 보유 대비 초과 수익</b> (최근 ${last.length}판, 오른쪽이 최신) — 위로 갈수록 매매 실력이 좋았던 판</div>${barSvg(last.map(h => h.ret - h.bh), lbl, v => fmtP(v))}</div>
      <div class="chartbox"><div class="cap">판별 <b>평균 타점 점수</b> — 0보다 높으면 지표상 좋은 자리 위주로 매매</div>${barSvg(last.map(h => h.score), lbl, v => (v >= 0 ? '+' : '') + v.toFixed(1))}</div>
      <div style="overflow-x:auto"><table class="htable"><thead><tr><th>#</th><th>날짜 · 종류</th><th>수익률</th><th>단순보유</th><th>초과</th><th>매매</th><th>승률</th><th>점수</th><th>다시</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  $('modalBox').innerHTML = `<h2>📈 내 연습 기록</h2>${body}
    <p class="muted" style="font-size:12px">기록은 이 기기의 브라우저(앱)에만 저장됩니다. 다른 기기로 옮기거나 지워질 때를 대비해 백업 파일을 저장해 두세요.</p>

// ── 기록 백업 (파일로 저장 / 불러와서 합치기) ──
async function exportBackup() {
  const H = store.get(K_HIST) || [];
  const d = new Date(), name = `coin-trainer-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  const text = JSON.stringify({ app: 'coinTrainer', v: 1, exportedAt: d.toISOString(), history: H, prefs: store.get(K_PREF) }, null, 1);
  const file = new File([text], name, { type: 'application/json' });
  // 아이패드: 공유 시트 → '파일에 저장' / 컴퓨터: 다운로드
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPad|iPhone|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
      await navigator.share({ files: [file], title: '코인 매매 연습 기록 백업' });
      return toast('공유 시트에서 "파일에 저장"을 고르면 백업이 저장됩니다.');
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`백업 파일 저장: ${name} (${H.length}판)`);
}
$('impFile').onchange = () => {
  const f = $('impFile').files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); } catch (e) { return toast('백업 파일을 읽을 수 없습니다.'); }
    const inc = data && data.app === 'coinTrainer' && Array.isArray(data.history) ? data.history.filter(h => h && h.at && TFS[h.tf] && typeof h.ret === 'number') : null;
    if (!inc) return toast('이 앱의 백업 파일이 아닙니다.');
    const H = store.get(K_HIST) || [], seen = new Set(H.map(h => `${h.id}-${h.at}`));

const LINE_COLOR = '#ff9f43';
const FIB = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
const FIB_COLOR = { 0: '#8a93a5', 0.236: '#c77dff', 0.382: '#4aa3ff', 0.5: '#2ecc71', 0.618: '#f5c542', 0.786: '#ff9f43', 1: '#8a93a5' };
function drawLine(l) {
  if (l.kind === 'h') {
    l.obj = sCandle.createPriceLine({ price: l.p1, color: LINE_COLOR, lineStyle: 0, lineWidth: 1, axisLabelVisible: true, title: '' });
    return true;
  }
  if (l.kind === 'f') {
    // 피보나치 되돌림: 첫 점(파동 시작)에서 둘째 점(파동 끝)까지의 움직임을 둘째 점 기준으로 되돌린 가격
    if (l.p1 === l.p2) return false;
    l.obj = FIB.map(r => sCandle.createPriceLine({ price: l.p2 - (l.p2 - l.p1) * r, color: FIB_COLOR[r], lineStyle: r === 0 || r === 1 ? 0 : 2,
      lineWidth: 1, axisLabelVisible: true, title: `${(r * 100).toFixed(r === 0.236 || r === 0.382 || r === 0.618 || r === 0.786 ? 1 : 0)}%` }));
    return true;
  }
  let a = tIndex.get(l.t1), b = tIndex.get(l.t2);
  if (a == null || b == null || a === b) return false;
  let pa = l.p1, pb = l.p2;
  if (a > b) { [a, b] = [b, a]; [pa, pb] = [pb, pa]; }
  l.a = a; l.pa = pa; l.slope = (pb - pa) / (b - a);
  l.obj = main.addLineSeries({ color: LINE_COLOR, lineWidth: 1.5, lastValueVisible: false, priceLineVisible: false,
    crosshairMarkerVisible: false, autoscaleInfoProvider: () => null, priceFormat: { type: 'price', precision: PD, minMove: Math.pow(10, -PD) } });
  // 현재 봉까지만 봉마다 점을 찍고, 봉이 진행될 때마다 한 칸씩 연장 (trendPush)
  // — 미래 봉 시각을 미리 넣으면 시간축이 늘어나 새 봉이 화면 밖으로 밀려나고, 끝점만 넣으면 기울기가 틀어짐
  const pts = [];
  for (let k = a; k <= cur; k++) pts.push({ time: C[k].time, value: pa + l.slope * (k - a) });
  l.obj.setData(pts);
  return true;
}
function trendPush(i) {
  userLines.forEach(l => { if (l.kind === 't' && l.obj && i >= l.a) l.obj.update({ time: C[i].time, value: l.pa + l.slope * (i - l.a) }); });
}

  else if (l.kind === 'f') l.obj.forEach(o => sCandle.removePriceLine(o));

}

  $('btnNext6').textContent = `⏩ +${TF.jump}봉(${TF.jumpTxt})`;
  $('mJump').textContent = `⏩ ${TF.jumpTxt}`;
  tIndex.clear(); RAW.forEach((c, i) => tIndex.set(c.time, i));
  $('startDate').min = fmtReal(RAW[HISTORY].time).slice(0, 10);
  $('startDate').max = fmtReal(RAW[RAW.length - 50].time).slice(0, 10);
  if (restore && restoreGame(restore)) return;
  let idx = -1;
  if (keepTime != null) {
    idx = RAW.findIndex(c => c.time >= keepTime);
    if (idx < HISTORY || idx > RAW.length - 50) { idx = -1; setTimeout(() => toast(`${coin} ${TF.name}봉 데이터 범위 밖이라 랜덤 시점에서 시작합니다.`), 2300); }
  }
  newGame(idx >= 0 ? idx : randomStart());
}
// 지난번 설정·진행 상황 불러오기
(() => {
  const p = store.get(K_PREF);
  if (p) { showBB = !!p.bb; lower = ['macd', 'both'].includes(p.lower) ? p.lower : 'rsi'; riskPct = [0.5, 1, 2].includes(p.risk) ? p.risk : 0; showHTF = p.htf !== false; }
  const s = store.get(K_STATE);
  if (s && TFS[s.tf] && s.coin) {
    coin = s.coin; blind = !!s.blind;
    setMode(s.mode === 'fut' ? 'fut' : 'spot');
    loadTF(s.tf, null, s);
  } else {
    setMode('spot');
    loadTF('4h');
  }
})();
})();
// 앱 설치·오프라인 실행용 서비스 워커 (웹 주소로 열었을 때만 동작)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 등록 실패', e));
}
</script>
