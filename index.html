<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC 연습">
<meta name="theme-color" content="#0f1218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>BTC 4시간봉 매매 연습</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0f1218; --panel:#171b23; --panel2:#1e232d; --line:#2a303c; --text:#e6e9ef; --muted:#8a93a5;
    --up:#26a69a; --down:#ef5350; --ma20:#f5c542; --ma60:#4aa3ff; --ma120:#c77dff; --accent:#4aa3ff;
    --good:#2ecc71; --mid:#f5c542; --bad:#ef5350;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  #status{color:var(--muted);font-size:12px}
  /* 화면 전체 높이를 헤더 + 본문으로 나눔 (아이패드 Safari의 100vh 오차·상단바 높이 변화에도 잘리지 않게) */
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  header{flex:none}
  /* 행 높이를 화면에 고정(minmax(0,1fr)) → 오른쪽 매매 기록이 길어져도 차트 영역이 늘어나지 않음 */
  .layout{display:grid;grid-template-columns:1fr 380px;grid-template-rows:minmax(0,1fr);gap:0;flex:1;min-height:0;overflow:hidden}
  main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  label.small{color:var(--muted);font-size:12px}
  input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.buy{background:var(--up);border-color:var(--up);color:#fff;font-weight:700;font-size:15px;padding:10px}
  button.sell{background:var(--down);border-color:var(--down);color:#fff;font-weight:700;font-size:15px;padding:10px}
  button.on{background:var(--accent);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.close{background:#3a4150;border-color:#3a4150;color:#fff;font-weight:700;font-size:15px;padding:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:4px 12px;font-size:12px}
  .tag.long{background:rgba(38,166,154,.2);color:var(--up)} .tag.short{background:rgba(239,83,80,.2);color:var(--down)}
  .tag.close{background:rgba(74,163,255,.2);color:var(--accent)} .tag.liq{background:rgba(245,197,66,.25);color:var(--mid)}
  #legend{padding:6px 12px;font-size:12px;color:var(--muted);min-height:26px;font-variant-numeric:tabular-nums}
  #legend b{color:var(--text);font-weight:600}
  .charts{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
  /* contain:strict — 차트가 그린 캔버스 크기가 다시 칸 크기를 키우는 순환을 막음 (Safari에서 차트가 점점 커지던 원인) */
  #mainChart,#rsiChart{contain:strict;overflow:hidden;position:relative}
  #mainChart{flex:3;min-height:0}
  .rsi-title{font-size:11px;color:var(--muted);padding:2px 12px;border-top:1px solid var(--line)}
  #rsiChart{flex:1;min-height:130px}
  aside{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}
  aside > .card{flex:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  .kv{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-variant-numeric:tabular-nums}
  .kv span:nth-child(odd){color:var(--muted)}
  .big{font-size:22px;font-weight:700}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .ratio{display:flex;gap:6px;margin-bottom:8px}
  .ratio button{flex:1}
  .tradebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hint{font-size:11px;color:var(--muted);margin-top:6px}
  .sig{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
  .sig:last-child{border-bottom:0}
  .trade{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2)}
  .trade .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .tag{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:700}
  .tag.buy{background:rgba(38,166,154,.2);color:var(--up)} .tag.sell{background:rgba(239,83,80,.2);color:var(--down)}
  .grade{font-size:12px;font-weight:700}
  .g-good{color:var(--good)} .g-mid{color:var(--mid)} .g-bad{color:var(--bad)}
  .trade ul{margin:4px 0 0;padding-left:16px;font-size:12px;line-height:1.55}
  .trade li.p{color:#9be7b5} .trade li.n{color:#f5a3a1} .trade li.z{color:var(--muted)}
  .hind{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;line-height:1.5}
  .muted{color:var(--muted)}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(640px,92vw);max-height:86vh;overflow:auto}
  #modal h2{margin-top:0}
  #modal ul{line-height:1.7}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:20}
  /* ── 터치 기기(아이패드 등) ── */
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  header{padding-top:max(10px, env(safe-area-inset-top))}
  @media (pointer:coarse){
    button{min-height:40px}
    input,select{font-size:16px;min-height:40px}   /* iOS 입력창 자동 확대 방지 */
    .seg button{min-height:34px}
  }
  #mbar{display:none}
  @media (max-width:900px){
    /* 세로 화면: 페이지 스크롤 방식, 차트 높이를 고정해서 RSI가 항상 다 보이게 */
    body{display:block;height:auto;padding-bottom:calc(118px + env(safe-area-inset-bottom))}
    .layout{grid-template-columns:1fr;grid-template-rows:auto;flex:none;overflow:visible}
    main{overflow:visible}
    main{border-right:0}
    .charts{flex:none}
    /* svh = 주소창이 펼쳐진 상태 기준의 고정 높이 → 스크롤 중 주소창이 접혀도 차트 크기가 변하지 않음 */
    #mainChart{flex:none;height:48vh;height:48svh;min-height:300px}
    #rsiChart{flex:none;height:160px}
    #mbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(23,27,35,.97);
      border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
    .mstat{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:6px;font-variant-numeric:tabular-nums}
    .mstat b{font-size:16px}
    .mbtns{display:flex;gap:6px}
    .mbtns button{flex:1;min-height:50px;font-size:15px;padding:6px 4px}
    .mbtns button.buy,.mbtns button.sell,.mbtns button.close{flex:1.4}
    #toast{bottom:calc(130px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<header>
  <h1 id="title">₿ BTC/USDT 4시간봉 매매 연습</h1>
  <span id="status">데이터 불러오는 중…</span>
</header>

<div class="layout">
  <main>
    <div class="toolbar">
      <label class="small">봉</label>
      <select id="tf">
        <option value="15m">15분</option>
        <option value="30m">30분</option>
        <option value="1h">1시간</option>
        <option value="4h" selected>4시간</option>
        <option value="1d">1일</option>
      </select>
      <span class="sep"></span>
      <label class="small">시작일</label>
      <input type="date" id="startDate">
      <button id="btnRandom">🎲 랜덤</button>
      <button id="btnStart" class="primary">새 연습 시작</button>
      <span class="sep"></span>
      <button id="btnNext" title="→ 또는 Space">▶ 다음 봉</button>
      <button id="btnNext6">⏩ +6봉</button>
      <button id="btnAuto" title="A">⏯ 자동재생</button>
      <select id="speed">
        <option value="1000">느림</option>
        <option value="400" selected>보통</option>
        <option value="150">빠름</option>
        <option value="50">매우 빠름</option>
      </select>
      <span class="sep"></span>
      <button id="btnReport">📊 결과 리포트</button>
    </div>
    <div id="legend"></div>
    <div class="charts">
      <div id="mainChart"></div>
      <div class="rsi-title">RSI(14) &nbsp; <span style="color:#ef5350">─ 70 과매수</span> &nbsp; <span style="color:#26a69a">─ 30 과매도</span></div>
      <div id="rsiChart"></div>
    </div>
  </main>

  <aside>
    <div class="card">
      <h3>계좌 현황</h3>
      <div class="big" id="totalRet">0.00%</div>
      <div class="kv" id="acctKv" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h3 style="display:flex;justify-content:space-between;align-items:center">주문
        <span class="seg" id="modeBtns"><button data-m="spot" class="on">현물</button><button data-m="fut">선물</button></span></h3>
      <div class="muted" style="font-size:12px;margin-bottom:8px">현재 봉 종가로 체결 · 수수료 <input id="fee" type="number" step="0.01" value="0.1" style="width:56px;padding:2px 4px">%</div>
      <div id="futOpts" style="display:none;margin-bottom:8px;font-size:12px">
        레버리지 <select id="lev">
          <option>1</option><option>2</option><option selected>3</option><option>5</option><option>10</option>
          <option>20</option><option>50</option><option>100</option>
        </select>배 <span class="muted">· 격리 마진 · 유지증거금률 0.5%</span>
      </div>
      <div class="ratio" id="ratioBtns">
        <button data-r="0.25">25%</button>
        <button data-r="0.5">50%</button>
        <button data-r="1" class="on">100%</button>
      </div>
      <div class="tradebtns" id="spotBtns">
        <button class="buy" id="btnBuy">매수 (B)</button>
        <button class="sell" id="btnSell">매도 (S)</button>
      </div>
      <div class="tradebtns" id="futBtns" style="display:none;grid-template-columns:1fr 1fr 1fr">
        <button class="buy" id="btnLong">롱 (B)</button>
        <button class="sell" id="btnShort">숏 (S)</button>
        <button class="close" id="btnClose">청산 (X)</button>
      </div>
      <div class="hint" id="orderHint"></div>
    </div>

    <div class="card">
      <h3>현재 봉 지표 상태</h3>
      <div id="signals" class="muted">-</div>
    </div>

    <div class="card">
      <h3>매매 기록 & 타점 평가</h3>
      <div id="trades" class="muted">아직 매매가 없습니다. 차트를 보고 매수/매도해 보세요.</div>
    </div>
  </aside>
</div>

<!-- 좁은 화면(아이패드 세로 등)에서 항상 보이는 하단 매매 바 -->
<div id="mbar">
  <div class="mstat"><span>수익률 <b id="mRet">0.00%</b></span><span id="mInfo" class="muted"></span></div>
  <div class="mbtns">
    <button id="mNext">▶ 다음</button>
    <button id="mJump">⏩</button>
    <button id="mAuto">⏯</button>
    <button id="mRatio" title="주문 비율">100%</button>
    <button class="buy" id="mBuy">매수</button>
    <button class="sell" id="mSell">매도</button>
    <button class="close" id="mClose" style="display:none">청산</button>
  </div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const KST = 9 * 3600;          // 차트 시간을 한국시간으로 표시
// 봉 주기별 설정: sec=봉 길이, look=사후평가 봉 수, lookTxt=그 기간, jump=빨리감기 봉 수,
// k=변동성 배율(이격도·사후평가 기준을 주기에 맞게 조정), pages=불러올 1000봉 묶음 수
const TFS = {
  '15m': { name: '15분',  sec: 900,   look: 16, lookTxt: '4시간', jump: 4,  jumpTxt: '1시간', k: 0.35, pages: 6 },
  '30m': { name: '30분',  sec: 1800,  look: 16, lookTxt: '8시간', jump: 2,  jumpTxt: '1시간', k: 0.5,  pages: 6 },
  '1h':  { name: '1시간', sec: 3600,  look: 24, lookTxt: '1일',   jump: 6,  jumpTxt: '6시간', k: 0.65, pages: 6 },
  '4h':  { name: '4시간', sec: 14400, look: 12, lookTxt: '2일',   jump: 6,  jumpTxt: '1일',   k: 1,    pages: 5 },
  '1d':  { name: '1일',   sec: 86400, look: 7,  lookTxt: '7일',   jump: 7,  jumpTxt: '1주',   k: 1.8,  pages: 4 },
};
let tf = '4h', TF = TFS[tf], LOOKAHEAD = TF.look;
const cache = {};
const INITIAL = 10000;         // 시작 자본 (USDT)
const HISTORY = 150;           // 시작 시점 이전에 보여줄 최소 봉 수

let C = [];                    // 전체 캔들
let MA20 = [], MA60 = [], MA120 = [], RSI = [], VAVG = [];
let cur = 0, startIdx = 0, timer = null, ratio = 1;
let acct, trades, mode = 'spot';   // mode: 'spot' 현물 | 'fut' 선물

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const fmtT = t => { const d = new Date(t * 1000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const fmtN = (v, d = 2) => v == null || isNaN(v) ? '-' : v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtP = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 1800); }

// ───────────── 데이터 ─────────────
async function fetchBinance(interval, pages) {
  const hosts = ['https://data-api.binance.vision', 'https://api.binance.com', 'https://api1.binance.com'];
  for (const h of hosts) {
    try {
      let all = [], endTime = null;
      for (let p = 0; p < pages; p++) {
        const url = `${h}/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=1000` + (endTime ? `&endTime=${endTime}` : '');
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        const rows = await r.json();
        if (!rows.length) break;
        all = rows.concat(all);
        endTime = rows[0][0] - 1;
        if (rows.length < 1000) break;
      }
      const now = Date.now();
      return { src: 'Binance', data: all.filter(r => r[6] < now).map(r => ({
        time: Math.floor(r[0] / 1000) + KST, open: +r[1], high: +r[2], low: +r[3], close: +r[4], volume: +r[5] })) };
    } catch (e) { console.warn('fetch fail', h, e); }
  }
  return null;
}
function sampleData(sec) {          // 오프라인용 가상 데이터
  const out = []; let p = 30000, t = Math.floor(Date.UTC(2023, 0, 1) / 1000) + KST;
  const s = Math.sqrt(sec / 14400);
  for (let i = 0; i < 3000; i++) {
    const drift = Math.sin(i / 180) * 0.002 * s, vol = 0.012 * s;
    const o = p, c = o * Math.exp(drift + vol * (Math.random() * 2 - 1) * 1.2);
    const h = Math.max(o, c) * (1 + Math.random() * 0.008), l = Math.min(o, c) * (1 - Math.random() * 0.008);
    out.push({ time: t, open: o, high: h, low: l, close: c, volume: 800 + Math.random() * 1500 * (1 + Math.abs(c - o) / o * 60) });
    p = c; t += sec;
  }
  return out;
}

// ───────────── 지표 ─────────────
function sma(src, n) {
  const out = new Array(src.length).fill(null); let s = 0;
  for (let i = 0; i < src.length; i++) { s += src[i]; if (i >= n) s -= src[i - n]; if (i >= n - 1) out[i] = s / n; }
  return out;
}
function rsiCalc(cl, n = 14) {
  const out = new Array(cl.length).fill(null); let g = 0, l = 0;
  for (let i = 1; i < cl.length; i++) {
    const d = cl[i] - cl[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); } }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l); }
  }
  return out;
}
function computeIndicators() {
  const cl = C.map(c => c.close), vo = C.map(c => c.volume);
  MA20 = sma(cl, 20); MA60 = sma(cl, 60); MA120 = sma(cl, 120); RSI = rsiCalc(cl, 14); VAVG = sma(vo, 20);
}

// ───────────── 차트 ─────────────
const LC = LightweightCharts;
const base = {
  autoSize: true,
  layout: { background: { color: '#0f1218' }, textColor: '#8a93a5', fontSize: 11 },
  grid: { vertLines: { color: '#1b2029' }, horzLines: { color: '#1b2029' } },
  crosshair: { mode: LC.CrosshairMode.Normal },
  rightPriceScale: { borderColor: '#2a303c', minimumWidth: 80 },
  timeScale: { borderColor: '#2a303c', timeVisible: true, secondsVisible: false, rightOffset: 8 },
  // 터치: 좌우로 끌면 차트 이동, 위아래로 끌면 페이지 스크롤 (차트가 세로 터치를 가로채지 않게)
  handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
  // 확대/축소: 두 손가락 핀치·마우스 휠·시간축 끌기만. 가격축은 항상 자동 맞춤
  handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: false }, axisDoubleClickReset: true },
};
const main = LC.createChart($('mainChart'), { ...base, timeScale: { ...base.timeScale, visible: false } });
const rsiC = LC.createChart($('rsiChart'), base);
const sCandle = main.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' });

// 화면 회전·크기 변경 시 차트 크기를 칸에 맞춰 강제로 다시 맞춤
// (아이패드 Safari는 가로→세로→가로 전환 때 자동 맞춤이 누락되어 세로 크기로 남는 경우가 있음)
function fitCharts() {
  [[main, 'mainChart'], [rsiC, 'rsiChart']].forEach(([ch, id]) => {
    const el = $(id), w = el.clientWidth, h = el.clientHeight;
    if (!w || !h) return;
    const range = ch.timeScale().getVisibleLogicalRange();
    ch.applyOptions({ autoSize: false });
    ch.resize(w, h, true);
    ch.applyOptions({ autoSize: true });
    if (range) ch.timeScale().setVisibleLogicalRange(range);
  });
}
let fitTimer = null;
const scheduleFit = () => {
  clearTimeout(fitTimer);
  fitTimer = setTimeout(fitCharts, 150);
  setTimeout(fitCharts, 600);   // 회전 애니메이션이 끝난 뒤 한 번 더
};
window.addEventListener('resize', scheduleFit);
window.addEventListener('orientationchange', scheduleFit);
if (window.visualViewport) visualViewport.addEventListener('resize', scheduleFit);
if (screen.orientation) screen.orientation.addEventListener('change', scheduleFit);

main.timeScale().subscribeVisibleLogicalRangeChange(r => { if (syncing || !r) return; syncing = true; rsiC.timeScale().setVisibleLogicalRange(r); syncing = false; });
rsiC.timeScale().subscribeVisibleLogicalRangeChange(r => { if (syncing || !r) return; syncing = true; main.timeScale().setVisibleLogicalRange(r); syncing = false; });

const barC = i => ({ time: C[i].time, open: C[i].open, high: C[i].high, low: C[i].low, close: C[i].close });
const barV = i => ({ time: C[i].time, value: C[i].volume, color: C[i].close >= C[i].open ? 'rgba(38,166,154,.45)' : 'rgba(239,83,80,.45)' });
const barL = (arr, i) => arr[i] == null ? { time: C[i].time } : { time: C[i].time, value: arr[i] };

function renderAll() {
  const idx = [...Array(cur + 1).keys()];
  sCandle.setData(idx.map(barC)); sVol.setData(idx.map(barV));
  sMA20.setData(idx.map(i => barL(MA20, i))); sMA60.setData(idx.map(i => barL(MA60, i))); sMA120.setData(idx.map(i => barL(MA120, i)));
  sRSI.setData(idx.map(i => barL(RSI, i)));
  main.timeScale().setVisibleLogicalRange({ from: cur - 130, to: cur + 8 });

function pushBar(i) {

  sMA20.update(barL(MA20, i)); sMA60.update(barL(MA60, i)); sMA120.update(barL(MA120, i)); sRSI.update(barL(RSI, i));

const MK = {

  sell:       { position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: 'S' },

  if (mode === 'fut' && acct.pos) {

}
const tIndex = new Map();

   &nbsp; 거래량 <b>${fmtN(c.volume, 0)}</b> &nbsp; RSI <b>${fmtN(RSI[i], 1)}</b>`;

// ───────────── 리플레이 ─────────────
function newGame(idx) {
  stopAuto();
  startIdx = cur = Math.max(HISTORY, Math.min(idx, C.length - 50));
  acct = { cash: INITIAL, btc: 0, cost: 0, pos: null };
  trades = [];
  $('lev').disabled = false;
  $('startDate').value = fmtT(C[cur].time).slice(0, 10);
  renderAll();
  toast(`${fmtT(C[cur].time)} 부터 연습 시작!`);
}
function step(n = 1) {
  for (let k = 0; k < n; k++) {
    if (cur >= C.length - 1) { stopAuto(); toast('데이터의 끝입니다. 결과 리포트를 확인하세요.'); break; }
    cur++; pushBar(cur);
    if (checkLiq()) { stopAuto(); setMarkers(); toast('⚠ 강제 청산! 증거금을 모두 잃었습니다.'); break; }
  }
  updateUI(); legend(cur);
}
function stopAuto() { clearInterval(timer); timer = null; $('btnAuto').classList.remove('on'); $('mAuto').classList.remove('on'); }
function toggleAuto() {
  if (timer) return stopAuto();
  $('btnAuto').classList.add('on'); $('mAuto').classList.add('on');
  timer = setInterval(() => step(1), +$('speed').value);
}
$('speed').onchange = () => { if (timer) { stopAuto(); toggleAuto(); } };

// ───────────── 매매 ─────────────
const feeRate = () => Math.max(0, +$('fee').value || 0) / 100;
function buy() {
  const price = C[cur].close, amt = acct.cash * ratio;
  if (amt < 1) return toast('매수할 현금이 없습니다.');
  const qty = amt * (1 - feeRate()) / price;
  acct.cash -= amt; acct.btc += qty; acct.cost += amt;
  record('buy', price, qty, amt, null);
}
function sell() {
  if (acct.btc <= 1e-10) return toast('매도할 BTC가 없습니다.');
  const price = C[cur].close, qty = ratio >= 1 ? acct.btc : acct.btc * ratio;
  const proceeds = qty * price * (1 - feeRate());
  const costPart = acct.cost / acct.btc * qty;
  const pnl = proceeds - costPart;
  acct.cash += proceeds; acct.btc -= qty; acct.cost -= costPart;
  if (acct.btc < 1e-10) { acct.btc = 0; acct.cost = 0; }
  record('sell', price, qty, proceeds, { pnl, pct: pnl / costPart * 100 });
}
// ── 선물: 격리 마진, 단방향 포지션 ──
const MMR = 0.005;   // 유지증거금률
const ACT = { buy: '매수', sell: '매도', long: '롱 진입', short: '숏 진입', closeLong: '롱 청산', closeShort: '숏 청산', liq: '강제 청산' };
function liqPrice(p) {
  const im = p.margin / (p.qty * p.entry);   // 실질 증거금률 (= 1/레버리지)
  return p.side > 0 ? p.entry * (1 - im + MMR) : p.entry * (1 + im - MMR);
}
function openPos(side) {
  const p = acct.pos;
  if (p && p.side !== side) return closePos(ratio);       // 반대 방향 주문 = 기존 포지션 축소/청산
  const price = C[cur].close, margin = acct.cash * ratio, lev = +$('lev').value;
  if (margin < 1) return toast('사용 가능한 증거금이 없습니다.');
  const fee = margin * lev * feeRate(), m = margin - fee, qty = m * lev / price;
  acct.cash -= margin;
  if (p) { const tq = p.qty + qty; p.entry = (p.entry * p.qty + price * qty) / tq; p.qty = tq; p.margin += m; }
  else acct.pos = { side, qty, entry: price, margin: m, lev };
  record(side > 0 ? 'long' : 'short', price, qty, margin, null, lev);
}
function closePos(r = 1) {
  const p = acct.pos; if (!p) return toast('보유 포지션이 없습니다.');
  const price = C[cur].close, q = r >= 1 ? p.qty : p.qty * r, part = q / p.qty;
  const pnl = p.side * (price - p.entry) * q, fee = q * price * feeRate(), mPart = p.margin * part, net = pnl - fee;
  acct.cash += Math.max(0, mPart + net);
  const type = p.side > 0 ? 'closeLong' : 'closeShort', lev = p.lev;
  p.qty -= q; p.margin -= mPart;
  if (p.qty < 1e-10) acct.pos = null;
  record(type, price, q, mPart + net, { pnl: net, pct: net / mPart * 100, move: p.side * (price / p.entry - 1) * 100 }, lev);
}
function checkLiq() {
  const p = acct.pos; if (mode !== 'fut' || !p) return false;
  const lp = liqPrice(p), c = C[cur];
  if (!((p.side > 0 && c.low <= lp) || (p.side < 0 && c.high >= lp))) return false;
  acct.pos = null;
  const t = { type: 'liq', i: cur, price: lp, qty: p.qty, amount: 0, lev: p.lev, side: p.side,
    result: { pnl: -p.margin, pct: -100, move: p.side * (lp / p.entry - 1) * 100 } };
  t.eval = { score: -3, label: '강제 청산', g: 'g-bad', pts: [
    { s: -3, txt: `${p.side > 0 ? '롱' : '숏'} ${p.lev}배 포지션이 청산가 ${fmtN(lp)}에 닿아 강제 청산됐습니다. 증거금 ${fmtN(p.margin)} USDT 전액 손실.` },
    { s: 0, txt: `진입가 대비 ${fmtP(t.result.move)} 움직임만으로 청산됐습니다. 레버리지를 낮추거나, 청산가 전에 손절하는 규칙을 정하세요.` }] };
  trades.push(t); updateUI();
  return true;
}
function record(type, price, qty, amount, result, lev = null) {
  const t = { type, i: cur, price, qty, amount, result, lev };
  t.eval = evaluate(t);
  trades.push(t);
  setMarkers(); updateUI();
  toast(`${ACT[type]} 체결 @ ${fmtN(price)} — ${t.eval.label}`);
}

// ───────────── 타점 평가 (체결 시점까지의 정보만 사용) ─────────────
function evaluate(t) {
  const i = t.i, c = C[i], r = RSI[i], m20 = MA20[i], m60 = MA60[i], m120 = MA120[i];
  const pts = []; const add = (s, txt) => pts.push({ s, txt });
  // 진입(매수·롱·숏)인지 청산(매도·롱청산·숏청산)인지, 그리고 방향(롱=+1, 숏=-1)
  const isEntry = ['buy', 'long', 'short'].includes(t.type);
  const dir = (t.type === 'short' || t.type === 'closeShort') ? -1 : 1;
  const L = dir > 0, act = ACT[t.type], R = r.toFixed(1);
  const up = m20 > m60 && c.close > m60, down = m20 < m60 && c.close < m60;
  const d20 = (c.close / m20 - 1) * 100;
  const vr = c.volume / VAVG[i], bull = c.close >= c.open;
  const far = 6 * TF.k, near = 2 * TF.k, lossCut = 5 * TF.k;   // 봉 주기에 맞춘 기준(%)
  // 숏 방향은 지표를 뒤집어서 같은 규칙으로 판단 (숏에게 과매수 = 롱에게 과매도)
  const rr = L ? r : 100 - r, upT = L ? up : down, downT = L ? down : up, dd = d20 * dir, bullT = L ? bull : !bull;

  if (isEntry) {
    // 1) RSI
    if (rr < 30) add(2, L ? `RSI ${R} — 과매도 구간 ${act}. 반등 확률이 높은 자리입니다.` : `RSI ${R} — 과매수 구간 숏 진입. 하락 반전 확률이 높은 자리입니다.`);
    else if (rr < 40) add(1, L ? `RSI ${R} — 낮은 편이라 가격 부담이 적은 ${act}입니다.` : `RSI ${R} — 높은 편이라 하락 여지가 있는 숏 진입입니다.`);
    else if (rr > 70) add(-2, L ? `RSI ${R} — 과매수 구간 ${act}. 단기 고점 추격 위험이 큽니다.` : `RSI ${R} — 과매도 구간 숏 진입. 바닥에서 추격 숏 — 반등(숏 스퀴즈) 위험이 큽니다.`);
    else if (rr > 60) add(-1, L ? `RSI ${R} — 다소 과열된 상태에서의 ${act}입니다.` : `RSI ${R} — 이미 많이 눌린 상태에서의 숏 진입입니다.`);
    else add(0, `RSI ${R} — 중립 구간입니다.`);
    // 2) 추세
    if (upT) add(1, L ? `MA20 > MA60 정배열 & 가격이 MA60 위 — 상승 추세에 순응하는 ${act}입니다.` : `MA20 < MA60 역배열 & 가격이 MA60 아래 — 하락 추세에 순응하는 숏입니다.`);
    else if (downT) add(-1, L ? `역배열 & 가격이 MA60 아래 — 하락 추세 중 ${act}(떨어지는 칼날) 주의.` : `정배열 & 가격이 MA60 위 — 상승 추세를 거스르는 숏, 위험합니다.`);
    else add(0, `이동평균선이 엇갈린 혼조 구간 — 추세 방향이 불분명합니다.`);
    if (m120 != null) add(0, (c.close > m120) === L ? `MA120 기준 장기 추세도 ${L ? '상승' : '하락'} 쪽 — 방향이 우호적입니다.` : `MA120 기준 장기 추세는 반대 방향입니다.`);
    // 3) 이격도
    if (dd > far) add(-1, L ? `MA20 대비 ${fmtP(d20)} 이격 — 단기 급등 후 추격 ${act}입니다.` : `MA20 대비 ${fmtP(d20)} — 급락 후 추격 숏입니다.`);
    else if (upT && Math.abs(d20) <= near) add(1, L ? `상승 추세 중 MA20 부근(${fmtP(d20)}) — 교과서적인 눌림목 ${act}입니다.` : `하락 추세 중 MA20 저항 부근(${fmtP(d20)}) — 교과서적인 되돌림 숏입니다.`);
    else if (dd < -far) add(1, L ? `MA20 대비 ${fmtP(d20)} 과도 하락 — 기술적 반등을 노릴 수 있는 구간입니다.` : `MA20 대비 ${fmtP(d20)} 과도 상승 — 되돌림 하락을 노릴 수 있는 구간입니다.`);
    // 4) 거래량
    if (vr > 1.5 && bullT) add(1, L ? `평균 대비 ${vr.toFixed(1)}배 거래량 양봉 — 매수세 유입이 확인됩니다.` : `평균 대비 ${vr.toFixed(1)}배 거래량 음봉 — 매도세가 확인됩니다.`);
    else if (vr > 1.5 && rr < 35) add(0, L ? `거래량 ${vr.toFixed(1)}배 투매성 음봉 — 바닥 신호일 수 있으나 확인이 필요합니다.` : `거래량 ${vr.toFixed(1)}배 급등 양봉 — 고점 신호일 수 있으나 확인이 필요합니다.`);
    else if (vr > 1.5) add(-1, L ? `거래량 ${vr.toFixed(1)}배 실린 음봉 — 매도 압력이 강한 상태입니다.` : `거래량 ${vr.toFixed(1)}배 실린 양봉 — 매수 압력이 강해 숏에 불리합니다.`);
    else if (vr < 0.6) add(0, `거래량이 평균의 ${vr.toFixed(1)}배로 적음 — 신호 신뢰도가 낮습니다.`);
    // 5) 레버리지 (선물)
    if (t.lev) {
      const dist = (1 / t.lev - MMR) * 100;
      if (t.lev >= 20) add(-1, `레버리지 ${t.lev}배 — 가격이 약 ${dist.toFixed(1)}%만 반대로 가도 청산됩니다. 매우 위험합니다.`);
      else if (dist < 3 * far) add(0, `레버리지 ${t.lev}배 — 청산가까지 약 ${dist.toFixed(1)}%. 손절가를 꼭 정해 두세요.`);
      else add(0, `레버리지 ${t.lev}배 — 청산가까지 약 ${dist.toFixed(1)}%로 여유가 있습니다.`);
    }
  } else {
    // 청산(매도·롱청산·숏청산): 포지션 방향 기준으로 '나가기 좋은 자리'인지 평가
    if (rr > 70) add(2, L ? `RSI ${R} — 과매수 구간 ${act}. 좋은 차익실현 자리입니다.` : `RSI ${R} — 과매도 구간 숏 청산. 좋은 익절 자리입니다.`);
    else if (rr > 60) add(1, L ? `RSI ${R} — 높은 편이라 ${act}하기 괜찮은 자리입니다.` : `RSI ${R} — 낮은 편이라 숏을 정리하기 괜찮은 자리입니다.`);
    else if (rr < 30) add(-2, L ? `RSI ${R} — 과매도 구간 ${act}. 바닥 근처 패닉셀일 가능성이 있습니다.` : `RSI ${R} — 과매수 구간 숏 청산. 급등에 쫓겨 고점에서 되산 것일 수 있습니다.`);
    else if (rr < 40) add(-1, L ? `RSI ${R} — 이미 많이 눌린 상태에서의 ${act}입니다.` : `RSI ${R} — 이미 많이 오른 상태에서의 숏 청산입니다.`);
    else add(0, `RSI ${R} — 중립 구간입니다.`);
    if (downT) add(1, L ? `역배열 하락 추세 구간에서 ${act} — 리스크 관리 측면에서 적절합니다.` : `정배열 상승 전환 구간에서 숏 청산 — 리스크 관리 측면에서 적절합니다.`);
    else if (upT && dd > 0) add(-1, L ? `정배열 상승 추세가 살아있고 MA20 위 — 너무 일찍 ${act}했을 수 있습니다.` : `하락 추세가 살아있고 MA20 아래 — 숏을 너무 일찍 정리했을 수 있습니다.`);
    else if (upT) add(0, L ? `상승 추세 중 MA20 이탈 — 단기 조정에 대응한 ${act}입니다.` : `하락 추세 중 MA20 위로 반등 — 단기 반등에 대응한 숏 청산입니다.`);
    else add(0, `이동평균선 혼조 구간에서의 ${act}입니다.`);
    if (dd > far) add(1, L ? `MA20 대비 ${fmtP(d20)} 이격 — 과열 구간에서의 차익실현입니다.` : `MA20 대비 ${fmtP(d20)} 이격 — 과도 하락 구간에서의 숏 익절입니다.`);
    else if (dd < -far) add(-1, L ? `MA20 대비 ${fmtP(d20)} 과도 하락 후 ${act} — 반등 직전에 던졌을 수 있습니다.` : `MA20 대비 ${fmtP(d20)} 급등 후 숏 청산 — 되돌림 직전에 손절했을 수 있습니다.`);
    if (vr > 1.5 && !bullT) add(1, L ? `거래량 ${vr.toFixed(1)}배 실린 음봉 — 매도 압력을 확인하고 대응했습니다.` : `거래량 ${vr.toFixed(1)}배 실린 양봉 — 매수 압력을 확인하고 대응했습니다.`);
    else if (vr > 1.5 && rr > 70) add(1, `거래량 ${vr.toFixed(1)}배 과열 — 클라이맥스(${L ? '고점' : '저점'}) 가능성이 있는 자리입니다.`);
    else if (vr > 1.5) add(-1, L ? `거래량 ${vr.toFixed(1)}배 강한 매수세 유입 중 ${act} — 상승 초입일 수 있습니다.` : `거래량 ${vr.toFixed(1)}배 강한 매도세 중 숏 청산 — 하락 초입일 수 있습니다.`);
    // 손익 관리 (선물은 레버리지 영향을 빼고 '가격 변동률'로 손절 크기를 판단)
    if (t.result) {
      const p = t.result.pct, mv = t.result.move ?? p, roe = t.lev ? ` (ROE, 가격 ${fmtP(mv)})` : '';
      if (p >= 0) add(0, `이번 ${act} 손익 ${fmtP(p)}${roe} 확정.`);
      else if (mv > -lossCut) add(0, `${fmtP(p)}${roe} 손절 — 손실을 작게 끊는 것은 좋은 습관입니다.`);
      else add(-1, `${fmtP(p)}${roe} 손절 — 손실이 커진 뒤의 늦은 손절입니다. 손절 기준을 미리 정하세요.`);
    }
  }
  const score = pts.reduce((a, b) => a + b.s, 0);
  const label = score >= 2 ? '좋은 타점' : score >= 0 ? '보통 타점' : '위험한 타점';
  const g = score >= 2 ? 'g-good' : score >= 0 ? 'g-mid' : 'g-bad';
  return { pts, score, label, g };
}

// ───────────── 사후 평가 (이후 12봉 결과) ─────────────
function hindsight(t) {
  const done = cur - t.i;
  if (t.type === 'liq') return { pending: true, html: '' };
  if (done < LOOKAHEAD) return { pending: true, html: `<span class="muted">⏳ 사후 평가 대기중… (${done}/${LOOKAHEAD}봉, ${TF.lookTxt} 뒤 결과 확인)</span>` };
  const k = TF.k;
  const p = t.price;
  let hi = -Infinity, lo = Infinity;
  for (let k = t.i + 1; k <= t.i + LOOKAHEAD; k++) { hi = Math.max(hi, C[k].high); lo = Math.min(lo, C[k].low); }
  const upP = (hi / p - 1) * 100, dnP = (lo / p - 1) * 100;
  let wHi = -Infinity, wLo = Infinity;
  for (let k = Math.max(0, t.i - LOOKAHEAD); k <= t.i + LOOKAHEAD; k++) { wHi = Math.max(wHi, C[k].high); wLo = Math.min(wLo, C[k].low); }
  const pos = (p - wLo) / (wHi - wLo || 1) * 100;
  let verdict, s;
  const act = ACT[t.type];
  // 매수·롱 진입·숏 청산은 '이후 오르면 좋은' 타점, 매도·숏 진입·롱 청산은 '이후 내리면 좋은' 타점
  if (['buy', 'long', 'closeShort'].includes(t.type)) {
    if (upP >= 3 * k && dnP > -2 * k) { verdict = `${act} 후 거의 흔들림 없이 상승 — 결과적으로 훌륭한 타점입니다.`; s = 1; }
    else if (dnP <= -4 * k && upP < 2 * k) { verdict = t.type === 'closeShort' ? `숏 청산 후 더 내렸습니다 — 너무 일찍 정리했습니다.` : `${act} 후 바로 하락 — 결과적으로 성급했습니다.`; s = -1; }
    else if (pos <= 30) { verdict = `전후 구간의 저점권에서 ${act}했습니다. 좋은 위치입니다.`; s = 1; }
    else if (pos >= 70) { verdict = `전후 구간의 고점권에서 ${act}했습니다.`; s = -1; }
    else { verdict = '등락이 섞인 평범한 결과입니다.'; s = 0; }
  } else {
    if (dnP <= -3 * k && upP < 2 * k) { verdict = t.type === 'short' ? '숏 진입 후 하락 — 결과적으로 훌륭한 숏 타점입니다.' : `${act} 후 추가 하락 — 하락을 잘 피했습니다.`; s = 1; }
    else if (upP >= 4 * k) { verdict = t.type === 'short' ? '숏 진입 후 상승 — 결과적으로 성급한 숏입니다.' : `${act} 후 더 올랐습니다 — 너무 일찍 판 것입니다.`; s = -1; }
    else if (pos >= 70) { verdict = `전후 구간의 고점권에서 ${act}했습니다. 좋은 위치입니다.`; s = 1; }
    else if (pos <= 30) { verdict = `전후 구간의 저점권에서 ${act}했습니다.`; s = -1; }
    else { verdict = '등락이 섞인 평범한 결과입니다.'; s = 0; }
  }
  const g = s > 0 ? 'g-good' : s < 0 ? 'g-bad' : 'g-mid';
  return { pending: false, s, html:
    `<b class="${g}">🔍 사후 평가: ${verdict}</b><br>
     <span class="muted">이후 ${TF.lookTxt}간 최고 <span class="pos">${fmtP(upP)}</span> / 최저 <span class="neg">${fmtP(dnP)}</span> ·
     전후 ${LOOKAHEAD}봉씩 가격범위 중 <b>${pos.toFixed(0)}%</b> 위치 (0%=최저, 100%=최고)</span>` };
}

  let h = row('현재 시각(KST)', fmtT(C[cur].time)) + row('현재가', fmtN(price)) + row('총 평가금액', fmtN(eq) + ' USDT');
  if (mode === 'spot') {
    const avg = acct.btc > 0 ? acct.cost / acct.btc : null;
    h += row('현금', fmtN(acct.cash) + ' USDT') + row('보유 BTC', fmtN(acct.btc, 6)) + row('평균 매수가', avg ? fmtN(avg) : '-')
       + row('보유분 수익률', avg ? pc((price * (1 - feeRate()) / avg - 1) * 100) : '-');
  } else {

    if (p) {
      const upnl = p.side * (price - p.entry) * p.qty, lp = liqPrice(p), dist = (p.side > 0 ? price / lp - 1 : lp / price - 1) * 100;
      h += row('포지션', `<b class="${p.side > 0 ? 'pos' : 'neg'}">${p.side > 0 ? '롱' : '숏'} ${p.lev}배</b> · ${fmtN(p.qty, 4)} BTC`)
         + row('진입가', fmtN(p.entry))
         + row('청산가', `<span style="color:var(--mid)">${fmtN(lp)}</span> <span class="muted">(${dist.toFixed(1)}% 남음)</span>`)
         + row('포지션 증거금', fmtN(p.margin) + ' USDT')
         + row('미실현 손익 (ROE)', `<span class="${cls(upnl)}">${fmtN(upnl)}</span> (${pc(upnl / p.margin * 100)})`);
    } else h += row('포지션', '<span class="muted">없음</span>');
  }
  $('acctKv').innerHTML = h + row('단순 보유(B&H) 수익률', pc(bh));
  // 하단 바 요약
  $('mRet').innerHTML = pc(ret);
  let info = `${fmtT(C[cur].time).slice(5)} · ${fmtN(price, 0)}`;
  if (mode === 'fut' && acct.pos) {
    const p = acct.pos, roe = p.side * (price - p.entry) * p.qty / p.margin * 100;
    info += ` · <b class="${p.side > 0 ? 'pos' : 'neg'}">${p.side > 0 ? '롱' : '숏'} ${p.lev}x</b> ${pc(roe)}`;
  } else if (mode === 'spot' && acct.btc > 0) {
    info += ` · 보유 ${pc((price * (1 - feeRate()) / (acct.cost / acct.btc) - 1) * 100)}`;
  }
  $('mInfo').innerHTML = info;
  $('lev').disabled = !!acct.pos;
  updatePosLines();
  // 현재 지표
  const r = RSI[cur], m20 = MA20[cur], m60 = MA60[cur], vr = C[cur].volume / VAVG[cur];
  const trend = m20 > m60 && price > m60 ? '<span class="pos">정배열 (상승)</span>' : m20 < m60 && price < m60 ? '<span class="neg">역배열 (하락)</span>' : '<span style="color:var(--mid)">혼조</span>';
  const rs = r > 70 ? '<span class="neg">과매수</span>' : r < 30 ? '<span class="pos">과매도</span>' : '중립';
  $('signals').innerHTML = `
    <div class="sig"><span>RSI(14)</span><span>${r.toFixed(1)} · ${rs}</span></div>
    <div class="sig"><span>이평선 배열 (20/60)</span><span>${trend}</span></div>
    <div class="sig"><span>MA20 이격도</span><span>${fmtP((price / m20 - 1) * 100)}</span></div>
    <div class="sig"><span>거래량 (20봉 평균 대비)</span><span>${vr.toFixed(2)}배</span></div>`;
  renderTrades();
}
function equity() {
  const price = C[cur].close, p = acct.pos;
  return acct.cash + acct.btc * price + (p ? p.margin + p.side * (price - p.entry) * p.qty : 0);
}
function renderTrades() {
  if (!trades.length) { $('trades').innerHTML = '<span class="muted">아직 매매가 없습니다. 차트를 보고 매수/매도해 보세요.</span>'; return; }
  $('trades').innerHTML = trades.slice().reverse().map(t => {
    const e = t.eval, h = hindsight(t);
    const res = t.result ? ` · 실현손익 <b class="${cls(t.result.pct)}">${fmtP(t.result.pct)}</b>${t.lev ? ' ROE' : ''} (${fmtN(t.result.pnl)} USDT)` : '';
    const tagCls = { buy: 'buy', long: 'long', sell: 'sell', short: 'short', closeLong: 'close', closeShort: 'close', liq: 'liq' }[t.type];
    return `<div class="trade">
      <div class="top"><span><span class="tag ${tagCls}">${ACT[t.type]}${t.lev ? ` ${t.lev}x` : ''}</span> ${fmtT(C[t.i].time)}</span>
      <span class="grade ${e.g}">${e.label} (${e.score >= 0 ? '+' : ''}${e.score})</span></div>
      <div class="muted" style="font-size:12px">체결가 ${fmtN(t.price)} · ${fmtN(t.qty, 6)} BTC${res}</div>
      <ul>${e.pts.map(p => `<li class="${p.s > 0 ? 'p' : p.s < 0 ? 'n' : 'z'}">${p.txt}</li>`).join('')}</ul>
      ${h.html ? `<div class="hind">${h.html}</div>` : ''}</div>`;
  }).join('');
}

function report() {
  stopAuto();
  const price = C[cur].close, eq = equity(), ret = (eq / INITIAL - 1) * 100;
  const bh = (price / C[startIdx].close - 1) * 100;
  // sells = 손익이 확정된 청산들, buys = 진입들
  const sells = trades.filter(t => t.result), buys = trades.filter(t => ['buy', 'long', 'short'].includes(t.type));
  const rsiDir = t => (t.type === 'short' || t.type === 'closeShort') ? 100 - RSI[t.i] : RSI[t.i];
  const wins = sells.filter(t => t.result.pnl > 0);
  const avgW = wins.length ? wins.reduce((a, t) => a + t.result.pct, 0) / wins.length : 0;
  const losses = sells.filter(t => t.result.pnl <= 0);
  const avgL = losses.length ? losses.reduce((a, t) => a + t.result.pct, 0) / losses.length : 0;
  const good = trades.filter(t => t.eval.score >= 2).length, bad = trades.filter(t => t.eval.score < 0).length;
  const hs = trades.map(hindsight).filter(h => !h.pending);
  const hGood = hs.filter(h => h.s > 0).length;
  const tips = [];
  const chase = buys.filter(t => rsiDir(t) > 65).length;
  if (chase >= 2 || (buys.length && chase / buys.length > 0.4)) tips.push('이미 많이 움직인 자리(롱·매수는 RSI 65↑, 숏은 RSI 35↓)에서 진입한 경우가 많습니다. <b>추격 진입 습관</b>을 점검하세요. 눌림목·되돌림(MA20 부근, RSI 40~60)을 기다려 보세요.');
  const panic = sells.filter(t => t.type !== 'liq' && rsiDir(t) < 35).length;
  if (panic >= 2) tips.push('불리한 극단(롱·매도는 RSI 35↓, 숏 청산은 RSI 65↑)에서 정리한 경우가 많습니다. <b>패닉 청산</b> 가능성이 있으니, 진입 전에 손절가를 미리 정해 두세요.');
  const liqs = trades.filter(t => t.type === 'liq');
  if (liqs.length) tips.push(`<b>강제 청산 ${liqs.length}회</b> — 선물에서 가장 피해야 할 결과입니다. 레버리지를 낮추고, 청산가보다 훨씬 앞에 손절가를 두세요.`);
  const levs = buys.filter(t => t.lev).map(t => t.lev);
  if (levs.length && levs.reduce((a, b) => a + b, 0) / levs.length >= 10) tips.push(`평균 레버리지가 ${(levs.reduce((a, b) => a + b, 0) / levs.length).toFixed(1)}배로 높습니다. 연습 단계에서는 3~5배 이하를 권장합니다.`);
  const shorts = buys.filter(t => t.type === 'short').length, longs = buys.filter(t => t.type === 'long').length;
  if (mode === 'fut' && buys.length >= 4 && (shorts === 0 || longs === 0)) tips.push(`${shorts === 0 ? '롱만' : '숏만'} 진입했습니다. 선물의 장점은 양방향이니, 추세가 바뀌면 반대 방향도 연습해 보세요.`);
  const lc = 5 * TF.k;
  const bigLoss = sells.filter(t => t.type !== 'liq' && (t.result.move ?? t.result.pct) < -lc).length;
  if (bigLoss) tips.push(`-${lc.toFixed(1)}% 이상 손실 매도가 ${bigLoss}회 있습니다. <b>손절은 짧게, 수익은 길게</b> 가져가는 연습이 필요합니다.`);
  if (avgW && avgL && Math.abs(avgL) > avgW) tips.push(`평균 손실(${fmtP(avgL)})이 평균 수익(${fmtP(avgW)})보다 큽니다. 손익비를 개선하세요.`);
  const counter = buys.filter(t => t.type === 'short'
    ? MA20[t.i] > MA60[t.i] && C[t.i].close > MA60[t.i]
    : MA20[t.i] < MA60[t.i] && C[t.i].close < MA60[t.i]).length;
  if (counter >= 2) tips.push(`추세를 거스른 진입(하락 추세 중 매수·롱, 상승 추세 중 숏)이 ${counter}회 있습니다. 추세가 돌아선 것을 확인한 뒤 진입하는 편이 안전합니다.`);
  if (ret > bh) tips.push('단순 보유(B&H)보다 높은 수익을 냈습니다. 👍 매매가 가치를 더했습니다.');
  else if (trades.length) tips.push('단순 보유(B&H)보다 수익이 낮습니다. 매매 횟수를 줄이고 확실한 자리만 노려보세요.');
  if (!tips.length) tips.push('매매 기록이 쌓이면 습관 분석을 보여드립니다.');
  const days = ((C[cur].time - C[startIdx].time) / 86400).toFixed(1);
  $('modalBox').innerHTML = `<h2>📊 연습 결과 리포트 (${TF.name}봉 · ${mode === 'fut' ? '선물' : '현물'})</h2>
    <div class="kv">
      <span>기간</span><span>${fmtT(C[startIdx].time)} ~ ${fmtT(C[cur].time)} (${days}일)</span>
      <span>최종 평가금액</span><span>${fmtN(eq)} USDT</span>
      <span>나의 수익률</span><span class="${cls(ret)}"><b>${fmtP(ret)}</b></span>
      <span>단순 보유 수익률</span><span class="${cls(bh)}">${fmtP(bh)}</span>
      <span>진입 / 청산 횟수</span><span>${buys.length} / ${sells.length}${liqs.length ? ` (강제청산 ${liqs.length})` : ''}</span>
      <span>승률 (청산 기준)</span><span>${sells.length ? (wins.length / sells.length * 100).toFixed(0) + '%' : '-'}</span>
      <span>평균 수익 / 평균 손실</span><span><span class="pos">${wins.length ? fmtP(avgW) : '-'}</span> / <span class="neg">${losses.length ? fmtP(avgL) : '-'}</span></span>
      <span>지표 기준 좋은 타점 / 위험 타점</span><span>${good} / ${bad} (전체 ${trades.length})</span>
      <span>사후 평가 좋은 결과</span><span>${hs.length ? `${hGood} / ${hs.length}` : '-'}</span>
    </div>
    <h3>💡 매매 습관 코멘트</h3><ul>${tips.map(t => `<li>${t}</li>`).join('')}</ul>
    <div style="text-align:right"><button class="primary" id="closeModal">닫기</button></div>`;
  $('modal').style.display = 'flex';
  $('closeModal').onclick = () => $('modal').style.display = 'none';
}

  const v = $('startDate').value; if (!v) return newGame(HISTORY);
  const [y, m, d] = v.split('-').map(Number), ts = Date.UTC(y, m - 1, d) / 1000;
  let i = C.findIndex(c => c.time >= ts); if (i < 0) i = C.length - 50;
  newGame(i);
};
function setRatio(r) {
  ratio = r;
  document.querySelectorAll('#ratioBtns button').forEach(x => x.classList.toggle('on', +x.dataset.r === r));
  $('mRatio').textContent = Math.round(r * 100) + '%';
}
document.querySelectorAll('#ratioBtns button').forEach(b => b.onclick = () => setRatio(+b.dataset.r));
// 하단 바 버튼
$('mNext').onclick = () => step(1);
$('mJump').onclick = () => step(TF.jump);
$('mAuto').onclick = toggleAuto;
$('mRatio').onclick = () => setRatio(ratio === 0.25 ? 0.5 : ratio === 0.5 ? 1 : 0.25);
$('mBuy').onclick = () => mode === 'fut' ? openPos(1) : buy();
$('mSell').onclick = () => mode === 'fut' ? openPos(-1) : sell();
$('mClose').onclick = () => closePos(ratio);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || !C.length) return;
  const k = e.key.toLowerCase();
  if (k === 'b') mode === 'fut' ? openPos(1) : buy();
  else if (k === 's') mode === 'fut' ? openPos(-1) : sell();
  else if (k === 'arrowright' || k === ' ') { e.preventDefault(); step(1); }
  else if (k === 'a') toggleAuto();
  else if (k === 'x' && mode === 'fut') closePos(ratio);
  else if (k === 'escape') $('modal').style.display = 'none';
});

// ── 현물/선물 전환 ──
function setTitle() {
  $('title').textContent = `₿ BTC/USDT ${TF.name}봉 ${mode === 'fut' ? '선물' : '현물'} 매매 연습`;
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeBtns button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  const fut = m === 'fut';
  $('futOpts').style.display = fut ? 'block' : 'none';
  $('futBtns').style.display = fut ? 'grid' : 'none';
  $('spotBtns').style.display = fut ? 'none' : 'grid';
  $('mBuy').textContent = fut ? '롱' : '매수';
  $('mSell').textContent = fut ? '숏' : '매도';
  $('mClose').style.display = fut ? '' : 'none';
  $('fee').value = fut ? 0.05 : 0.1;   // 바이낸스 기준 테이커 수수료 (선물 0.05%, 현물 0.1%)
  $('orderHint').textContent = fut
    ? '진입: 가용 증거금의 선택 비율 × 레버리지 / 반대 방향 버튼 또는 청산(X): 보유 포지션의 선택 비율만큼 정리 · 캔들 고가/저가가 청산가에 닿으면 강제 청산 · 단축키 B 롱, S 숏, X 청산'
    : '매수: 보유 현금의 선택 비율 / 매도: 보유 BTC의 선택 비율 · 단축키 B, S, →, Space, A';
  setTitle();
}
document.querySelectorAll('#modeBtns button').forEach(b => b.onclick = () => {
  if (b.dataset.m === mode) return;
  if (trades.length && !confirm('현물/선물을 바꾸면 현재 연습(계좌·매매기록)이 초기화됩니다. 계속할까요?')) return;
  setMode(b.dataset.m);
  newGame(cur);
});
$('btnLong').onclick = () => openPos(1);
$('btnShort').onclick = () => openPos(-1);
$('btnClose').onclick = () => closePos(ratio);
setMode('spot');

// ───────────── 시작 ─────────────
// keepTime: 주기를 바꿀 때 보던 시점 근처에서 이어서 시작
async function loadTF(newTf, keepTime) {
  stopAuto();
  tf = newTf; TF = TFS[tf]; LOOKAHEAD = TF.look;
  $('tf').disabled = true;
  $('status').textContent = `${TF.name}봉 데이터 불러오는 중…`;
  if (!cache[tf]) {
    const res = await fetchBinance(tf, TF.pages);
    cache[tf] = res && res.data.length > 500 ? { data: res.data, real: true } : { data: sampleData(TF.sec), real: false };
  }
  $('tf').disabled = false;
  C = cache[tf].data;
  $('status').textContent = cache[tf].real
    ? `Binance BTCUSDT ${TF.name}봉 · ${C.length}봉 (${fmtT(C[0].time).slice(0,10)} ~ ${fmtT(C[C.length-1].time).slice(0,10)}) · 시간은 KST`
    : '⚠ 거래소 데이터를 불러오지 못해 가상 샘플 데이터로 실행 중';
  setTitle();
  $('btnNext6').textContent = `⏩ +${TF.jump}봉(${TF.jumpTxt})`;
  $('mJump').textContent = `⏩ ${TF.jumpTxt}`;
  tIndex.clear(); C.forEach((c, i) => tIndex.set(c.time, i));
  computeIndicators();
  $('startDate').min = fmtT(C[HISTORY].time).slice(0, 10);
  $('startDate').max = fmtT(C[C.length - 50].time).slice(0, 10);
  let idx = -1;
  if (keepTime != null) {
    idx = C.findIndex(c => c.time >= keepTime);
    if (idx < HISTORY || idx > C.length - 50) { idx = -1; toast(`${TF.name}봉 데이터 범위 밖이라 랜덤 시점에서 시작합니다.`); }
  }
  newGame(idx >= 0 ? idx : HISTORY + Math.floor(Math.random() * (C.length - HISTORY - 300)));
}
loadTF('4h');
})();
// 앱 설치·오프라인 실행용 서비스 워커 (웹 주소로 열었을 때만 동작)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW 등록 실패', e));
}
</script>
